<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Warkop Gemilang Jaya</title>
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe4; --card:#fffaf2; --ink:#2b1d14; --muted:#86705c; --line:#eadcc7;
  --brand:#b8532a; --brand-d:#8f3d1d; --brand-soft:#f7e0d2; --gold:#8a6512;
  --ok:#2f7d4f; --ok-soft:#dcefe2; --warn:#b7791f; --warn-soft:#fbecd0; --bad:#b03a2e;
  --r:18px; --shadow:0 1px 0 rgba(80,50,20,.04),0 6px 18px -10px rgba(80,50,20,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.serif{font-family:"Fraunces",Georgia,serif}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.price{font-family:"Fraunces",Georgia,serif;font-weight:800;color:var(--gold)}

/* ---------- Demo bar ---------- */
.demobar{background:var(--ink);color:#f6efe4;font-size:12.5px;padding:6px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.demobar button{color:#f6efe4;padding:7px 14px;border-radius:99px;border:1px solid #6b5444;font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation}
.demobar button.on{background:var(--brand);border-color:var(--brand)}

/* ---------- Hero ---------- */
.hero{padding:22px 0 14px}
.hero .eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);font-weight:700}
.hero h1{margin:4px 0 2px;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.meja-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px}
.meja-pill b{color:var(--brand)}
.closed-note{margin-top:12px;background:var(--warn-soft);color:#6d4a0e;border-radius:12px;padding:10px 12px;font-size:13.5px}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,rgba(246,239,228,0));padding:8px 0 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:none;outline:none;flex:1;padding:12px 0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- Menu grid ---------- */
.sec h2{font-size:20px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card.off{opacity:.55}
.ph{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--brand-soft)}
.ph-fallback{aspect-ratio:4/3;display:grid;place-items:center;font-size:40px}
.badge{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.badge.habis{background:#6f6259}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-weight:700;line-height:1.25;font-size:14.5px}
.card .ds{font-size:12.5px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;gap:6px}
.card .price{font-size:16px}
.add{background:var(--brand);color:#fff;border-radius:12px;width:36px;height:36px;font-size:22px;line-height:1;display:grid;place-items:center;font-weight:600}
.step{display:flex;align-items:center;gap:2px;background:var(--brand-soft);border-radius:12px;padding:2px}
.step button{width:30px;height:32px;border-radius:10px;font-size:18px;font-weight:700;color:var(--brand-d)}
.step span{min-width:18px;text-align:center;font-weight:800;font-size:14px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* ---------- Cart bar ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.cartbar .inner{pointer-events:auto;max-width:728px;margin:0 auto;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px -10px rgba(43,29,20,.6)}
.cartbar .cnt{font-size:12px;opacity:.75;font-weight:700;letter-spacing:.08em}
.cartbar .tot{font-family:Fraunces,serif;font-weight:800;font-size:20px}
.cartbar .go{margin-left:auto;background:var(--brand);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700}
.spacer{height:110px}

/* ---------- Sheets / modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,20,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:22px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.line{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.line .info{flex:1;min-width:0}
.line .info b{display:block}
.line input{margin-top:6px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;font-size:15px}
.input:focus{border-color:var(--brand)}
textarea.input{resize:vertical;min-height:64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid #efc9c2}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:700}
.sumrow .price{font-size:22px}
.paynote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:6px 0 14px}
.detail-img{width:calc(100% + 36px);margin:-8px -18px 12px;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:24px 24px 0 0}
.detail-ph{width:calc(100% + 36px);margin:-8px -18px 12px;aspect-ratio:16/9;display:grid;place-items:center;font-size:72px;background:var(--brand-soft);border-radius:24px 24px 0 0}
.qtybig{display:flex;align-items:center;gap:14px;justify-content:center;margin:16px 0}
.qtybig button{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:700}
.qtybig span{font-size:22px;font-weight:800;min-width:30px;text-align:center}

/* ---------- Done ---------- */
.done{padding:30px 0 40px;text-align:center}
.ticket{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px 20px;margin:18px auto;max-width:420px;text-align:left}
.ticket .no{font-family:Fraunces,serif;font-size:56px;font-weight:800;color:var(--brand);text-align:center;line-height:1}
.track{display:flex;justify-content:space-between;margin:20px 0 6px;position:relative}
.track::before{content:"";position:absolute;top:13px;left:12%;right:12%;height:3px;background:var(--line)}
.track div{position:relative;text-align:center;flex:1;font-size:12px;font-weight:700;color:var(--muted)}
.track i{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;background:var(--line);font-style:normal;color:#fff;font-size:14px}
.track .on{color:var(--ink)} .track .on i{background:var(--ok)}


/* ---------- Tampilan simpel ---------- */
.hero2{display:flex;gap:14px;align-items:center;padding:16px 0 4px}
.hero2 .logo{width:84px;height:84px;flex:none;object-fit:contain}
.hero2 h1{margin:0;font-size:24px;line-height:1.15}
.hero2 p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.hero2 .meja-pill{margin-top:8px}
.sub{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:18px 0 10px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.cats{grid-template-columns:repeat(3,1fr)}}
.catbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:124px;transition:transform .1s}
.catbox:active{transform:scale(.97)}
.catbox .ic{font-size:30px;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:var(--brand-soft);margin-bottom:8px}
.catbox b{font-size:16px;line-height:1.2}
.catbox small{color:var(--muted);font-weight:600}
.catbox.cold .ic{background:#d9ecf7}
.catbox.hot .ic{background:#f8d9c6}
.catbox.gold .ic{background:#f7e7b4}
.vhead{display:flex;align-items:center;gap:10px;margin:16px 0 6px}
.vhead h2{margin:0;font-size:22px}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px;font-weight:800;flex:none}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
@media(max-width:350px){.items{grid-template-columns:repeat(2,1fr)}}
@media(min-width:620px){.items{grid-template-columns:repeat(4,1fr)}}
.ibox{position:relative;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 10px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:100px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s}
.ibox:active{transform:scale(.96)}
.ibox.sel{border-color:var(--brand);background:#fff6ee}
.ibox.off{opacity:.5}
.ibox img{width:calc(100% + 20px);margin:-12px -10px 4px;aspect-ratio:4/3;object-fit:cover;border-radius:14px 14px 0 0;display:block}
.ibox .nm{font-weight:700;font-size:13.5px;line-height:1.25}
.ibox .ds{font-size:11.5px;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ibox .pr{margin-top:auto;padding-top:4px;min-height:30px;display:flex;align-items:flex-end}
.ibox .price{font-size:15px}
.ibox .habis{font-weight:800;color:var(--bad);font-size:13px}
.qbadge{position:absolute;top:-7px;right:-7px;z-index:2;background:var(--brand);color:#fff;min-width:26px;height:26px;border-radius:13px;font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 7px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.minus{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:10px;background:var(--brand-soft);color:var(--brand-d);font-weight:800;font-size:18px;line-height:1}
.addbtn{margin-top:6px;width:100%;background:var(--brand);color:#fff;border-radius:11px;padding:8px 0;font-weight:800;font-size:13px}
.qctl{margin-top:6px;display:flex;align-items:center;justify-content:space-between;background:var(--brand-soft);border-radius:11px;padding:2px}
.qctl span{font-weight:800;font-size:15px}
.qb{width:34px;height:32px;border-radius:9px;font-size:20px;font-weight:800;line-height:1;color:var(--brand-d)}
.qb.plus{background:var(--brand);color:#fff}
.sisa{font-size:11px;font-weight:800;color:var(--warn)}
.stokbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stokpill{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);margin-left:4px}
.stokpill.low{background:var(--warn-soft);color:#7a5210}.stokpill.zero{background:#f6d6d1;color:var(--bad)}
.howto{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.howto ol{margin:6px 0 0;padding-left:18px}
.tip{text-align:center;color:var(--muted);font-size:12.5px;margin:14px 0 0}
.adm-logo{width:44px;height:44px;object-fit:contain}
.bigadd{width:100%;padding:16px;font-size:16px;margin-bottom:12px}
.shortcut{background:var(--card);border:1px dashed var(--brand);border-radius:14px;padding:12px;font-size:13px;margin-bottom:14px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}

/* ---------- Admin ---------- */
.adm-top{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.adm-top h1{font-size:22px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:8px 0 14px;position:sticky;top:6px;z-index:15}
.tabs button{flex:1;padding:10px 4px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted);position:relative}
.tabs button.on{background:var(--brand);color:#fff}
.tabs .dot{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.04em}
.stat b{font-size:20px;font-family:Fraunces,serif}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.order{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px;border-left:6px solid var(--line)}
.order.Baru{border-left-color:var(--bad)} .order.Diproses{border-left-color:var(--warn)} .order.Selesai{border-left-color:var(--ok)} .order.Batal{opacity:.55}
.order.fresh{animation:pulse 1.2s 3}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--brand-soft)}}
.order .hd{display:flex;align-items:center;gap:10px}
.order .no{font-family:Fraunces,serif;font-weight:800;font-size:22px}
.order .mj{background:var(--brand-soft);color:var(--brand-d);font-weight:800;border-radius:10px;padding:4px 10px;font-size:14px}
.order .st{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--line)}
.st.Baru{background:#f6d6d1;color:var(--bad)} .st.Diproses{background:var(--warn-soft);color:#7a5210} .st.Selesai{background:var(--ok-soft);color:var(--ok)}
.order ul{margin:10px 0;padding:0;list-style:none}
.order li{display:flex;gap:8px;padding:3px 0;font-size:14.5px}
.order li b{min-width:28px}
.order li em{color:var(--brand-d);font-size:12.5px;display:block}
.order .note{background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.order .ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order .ft .price{font-size:18px;margin-right:auto}
.mrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.mrow img,.mrow .th{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:var(--brand-soft);display:grid;place-items:center;font-size:24px}
.mrow .info{flex:1;min-width:0}
.mrow .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .info small{color:var(--muted)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d8cbb8;border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-size:16px;flex:none}
.checkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img,.photo-pick .th{width:84px;height:84px;border-radius:14px;object-fit:cover;background:var(--brand-soft);display:grid;place-items:center;font-size:32px}
.qr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.qr-grid{grid-template-columns:repeat(3,1fr)}}
.qr-card{background:#fff;border-radius:16px;padding:14px;text-align:center;border:1px solid var(--line);break-inside:avoid}
.qr-card .qr{display:grid;place-items:center;margin:8px 0}
.qr-card .qr img,.qr-card .qr canvas{width:100%!important;max-width:180px;height:auto!important}
.qr-card h4{margin:0;font-family:Fraunces,serif;font-size:20px}
.qr-card small{display:block;color:var(--muted);font-size:11.5px}
.login{max-width:360px;margin:12vh auto 0;background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);text-align:center}
.pin{letter-spacing:.6em;text-align:center;font-size:24px;font-weight:800}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media print{
  body{background:#fff}
  .noprint,.demobar,.tabs,.adm-top{display:none!important}
  .qr-grid{grid-template-columns:repeat(3,1fr)}
}
/* ---------- Pembayaran & Kas ---------- */
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paygrid button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.paygrid button i{font-style:normal;font-size:22px}
.paygrid button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d)}
.paybox{background:var(--card);border:2px dashed var(--brand);border-radius:16px;padding:14px;margin:4px 0 14px;text-align:center}
.paybox .price{font-size:18px}
.qrisimg{display:block;width:100%;max-width:300px;margin:10px auto;border-radius:12px;background:#fff}
.tfinfo{background:var(--bg);border-radius:12px;padding:12px;margin:10px 0;font-weight:700;font-size:15px;line-height:1.5;user-select:all;-webkit-user-select:all}
.paid{display:flex;gap:10px;align-items:center;justify-content:center;text-align:left;font-size:14px;background:var(--warn-soft);border-radius:12px;padding:12px;margin-top:8px}
.paid input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.pchip{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--line)}
.pchip.ok{background:var(--ok-soft);color:var(--ok)}.pchip.cek{background:var(--warn-soft);color:#7a5210}.pchip.blm{background:#f6d6d1;color:var(--bad)}
.cekbar{background:var(--warn-soft);border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px;line-height:1.6}
.cekbar .btn{margin-top:6px;background:var(--ok)}
.bymet{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.bymet span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
.kembali{font-size:16px;margin:10px 0 4px;min-height:22px}
.kembali b{color:var(--ok);font-size:20px}
.tabs button{font-size:12.5px;padding:10px 2px}
.kasdate{display:flex;gap:8px;margin-bottom:10px}
.kasdate .input{flex:1}
.kasbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.kasbtns .btn{padding:12px 4px;font-size:13px}
.kashead{font-weight:800;color:var(--brand);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.kasbig{background:var(--ink);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:10px}
.kasbig small{display:block;opacity:.7;font-weight:800;letter-spacing:.1em;font-size:11px}
.kasbig b{font-family:Fraunces,serif;font-size:32px;display:block;margin:2px 0}
.kasbig b.neg{color:#ff9a8a}
.kasbig span{font-size:12px;opacity:.7}
.kas2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kas2>div{border-radius:16px;padding:12px}
.kas2 small{display:block;font-weight:800;font-size:11px;letter-spacing:.06em}
.kas2 b{font-family:Fraunces,serif;font-size:20px;display:block;margin:2px 0}
.kas2 span{font-size:11.5px;opacity:.8}
.kin{background:var(--ok-soft);color:#1f5a37}.kout{background:#f6d6d1;color:#7d281f}
.kasmet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.kasmet>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.kasmet small{display:block;font-weight:700;font-size:11.5px;color:var(--muted)}
.kasmet b{display:block;font-size:14.5px;margin-top:2px}
.kasmet span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.kasinfo{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin:4px 0 6px}
.kash3{margin:20px 0 8px;font-size:18px}
.rekap{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.rekap .rh,.rekap .rr{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:4px;padding:9px 12px;font-size:13px;text-align:right;width:100%}
.rekap.w5 .rh,.rekap.w5 .rr{grid-template-columns:.9fr 1fr .9fr .9fr 1.05fr;padding:9px 8px;font-size:12px}
.rekap .rr .sal{font-weight:800;color:var(--ink)}
.rekap .rh{background:var(--bg);font-weight:800;font-size:11.5px;color:var(--muted)}
.rekap .rh span:first-child,.rekap .rr span:first-child{text-align:left}
.rekap .rr{border-top:1px solid var(--line)}
.rekap .rr b{color:var(--ok)}.rekap b.neg,.kasbig b.neg{color:var(--bad)}
.toplist{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:6px 12px}
.toplist div{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.toplist div+div{border-top:1px dashed var(--line)}
.bklist div span{flex:1;min-width:0}.bklist div b{width:44px;text-align:right}.bklist div em{width:92px;text-align:right;font-style:normal;color:var(--muted)}
.bklist .bkb{color:var(--warn);font-size:11px}.bklist .bktot{border-top:2px solid var(--line)!important;font-weight:800}.bklist .bktot em{color:inherit;font-weight:800}
.krow small.kitems{color:var(--ink);font-weight:600;white-space:normal}
.krow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.krow i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.krow i.in{background:var(--ok-soft);color:var(--ok)}.krow i.out{background:#f6d6d1;color:var(--bad)}.krow i.wait{background:var(--warn-soft);color:#7a5210}.krow i.x{background:var(--line);color:var(--muted)}
.krow span{flex:1;min-width:0}
.krow span b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow span small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow em{font-style:normal;font-weight:800;font-size:14px;white-space:nowrap}
em.pos{color:var(--ok)}em.neg{color:var(--bad)}
.bignum{font-size:26px!important;font-weight:800;text-align:center;font-family:Fraunces,serif}
.catchips{display:flex;flex-wrap:wrap;gap:6px}
.catchips button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-weight:600;font-size:13.5px}
.catchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Diskon, stok bahan, laporan ---------- */
.promo{margin-top:12px;background:#fff1c9;border:1px solid #f0d58a;color:#6b4e09;border-radius:12px;padding:10px 12px;font-size:13.5px}
.discline{background:var(--ok-soft);color:#1f5a37;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0 0}
.discline.hint2{background:#fff1c9;color:#6b4e09}
.variant{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;font-weight:600}
.variant select{flex:1;border:1px solid var(--brand);border-radius:10px;padding:6px 8px;background:var(--brand-soft);font-weight:700;color:var(--brand-d)}
.brow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.brow.low{border-left-color:var(--warn)}.brow.zero{border-left-color:var(--bad);background:#fff4f2}
.brow .info b{display:block;font-size:15px}.brow .info small{color:var(--muted);font-size:12px}
.brow.low .info small{color:#7a5210;font-weight:700}.brow.zero .info small{color:var(--bad);font-weight:700}
.brow .bq{text-align:right}.brow .bq b{font-family:Fraunces,serif;font-size:22px;display:block;line-height:1}.brow .bq small{color:var(--muted);font-size:11.5px}
.brow .bbtn{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.mrow .info small.rs{display:block;color:var(--brand-d);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow{background:var(--bg);border-radius:12px;padding:8px;margin-top:6px}
.rtop{display:flex;gap:6px}.rtop select{flex:1}.rtop input{width:64px;text-align:center}
.ralt{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.ralt small{color:var(--muted);font-size:11.5px;width:100%}
.ralt button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600}
.ralt button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.drules{display:grid;gap:8px}
.drule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.drule b{grid-column:1/-1;font-size:13px}
.drule label span{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.drule label:last-child{grid-column:1/-1}
.lap{background:#fff;color:#1d1410;border-radius:16px;padding:16px 14px;font-size:13.5px;border:1px solid var(--line)}
.laph{display:flex;gap:12px;align-items:center;border-bottom:2px solid #1d1410;padding-bottom:10px;margin-bottom:6px}
.laph img{width:56px;height:56px;object-fit:contain}
.laph b{display:block;font-family:Fraunces,serif;font-size:18px}.laph span{display:block;font-weight:800;color:var(--brand);letter-spacing:.08em;font-size:12px}.laph small{color:#6b5a4c;font-size:11.5px}
.lsec{padding:10px 0;border-bottom:1px dashed #cbbfae}.lsec:last-child{border-bottom:0}
.lsec h4{margin:0 0 6px;font-size:14px}
.lr{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.lr b{white-space:nowrap}.lr small{color:#6b5a4c}
.lr.lsub{color:#6b5a4c;font-size:12px;padding-left:10px}.lsaldo{background:#f6efe4;margin:6px -14px 0;padding:10px 14px;border-bottom:0}
.lr.tot.big{font-size:17px}
.lr.tot{border-top:1px solid #1d1410;margin-top:4px;padding-top:6px;font-weight:800;font-size:15px}.lr.tot.sm{font-size:13.5px}
.lr b.neg{color:var(--bad)}
.lmet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.lmet div{background:#f6efe4;border-radius:10px;padding:6px 8px}.lmet small{display:block;font-size:11px;color:#6b5a4c}.lmet b{font-size:13px}
.lwarn{background:var(--warn-soft);border-radius:8px;padding:6px 8px;margin-top:8px;font-size:12px}
.lt{width:100%;border-collapse:collapse;font-size:13px}.lt th{text-align:right;font-size:11px;color:#6b5a4c;padding:4px 3px;border-bottom:1px solid #1d1410}
.lt td{text-align:right;padding:4px 3px;border-bottom:1px solid #eee3d3}.lt th:first-child,.lt td:first-child{text-align:left}
.lt tr.tt td{font-weight:800;border-top:1px solid #1d1410;border-bottom:0}.lt tr.low td{background:#fff3df}.lt td small{color:#6b5a4c;font-size:10.5px}
.lnote{font-size:11.5px;color:#6b5a4c;margin-top:4px}
.lapbtn{display:grid;gap:8px;margin-top:12px}
@media print{ body.print-struk .lap{border:0;font-size:12px} }

/* ---------- Saldo & belanja ---------- */
.saldobox{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.saldobox .sr1{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px}
.saldobox .sr1.tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;font-weight:800;font-size:15px}
.saldobox .sr1.tot b{font-family:Fraunces,serif;font-size:24px}
.saldobox b.pos{color:var(--ok)}.saldobox b.neg{color:var(--bad)}
.saldobox.empty{border-style:dashed;display:flex;flex-direction:column;gap:6px;font-size:13px}
.saldobox.empty .btn{align-self:flex-start}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12px;padding:6px 0 0;text-decoration:underline}
.bjrow{background:var(--bg);border-radius:14px;padding:10px;margin-bottom:8px}
.bj1{display:flex;gap:6px}.bj1 .input{flex:1}
.bj2{display:grid;grid-template-columns:.8fr 1fr 1.5fr;gap:6px;margin-top:6px}
.bj2 small{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.bj3{margin-top:8px;font-size:13px}.bj3.muted{font-size:12px}
.bj3 .chk{display:flex;gap:8px;align-items:center}.bj3 .chk input{width:20px;height:20px;accent-color:var(--ok)}
.bjconv{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;background:var(--ok-soft);border-radius:10px;padding:6px 8px}
.bjconv .input{width:70px;padding:6px;text-align:center}
.bjconv b.pos{color:var(--ok)}
.bjtotal{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;margin:6px 0 10px}
.bjtotal span{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.7}
.bjtotal b{font-family:Fraunces,serif;font-size:26px}
.bjtotal small{display:block;font-size:12px;opacity:.85;margin-top:2px}

/* ---------- Tambah cepat ---------- */
.addrow{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-bottom:12px}
.addrow .bigadd{margin:0;padding:12px 8px;flex-direction:column;gap:0;line-height:1.2}
.addrow .bigadd small{font-size:11px;font-weight:600;opacity:.85}
.qhead{display:none}
.qrow{display:grid;grid-template-columns:1fr 1fr 38px;gap:6px;margin-bottom:8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px}
.qrow>[data-f="nama"]{grid-column:1/3;grid-row:1}
.qrow>[data-del]{grid-column:3;grid-row:1}
.qrow>input:nth-child(2){grid-column:1;grid-row:2}
.qrow>input:nth-child(3){grid-column:2;grid-row:2}
.qrow .input{padding:10px 8px;font-size:14px}
.qprog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.qprog .bar{height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
.qprog .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* ---------- Foto cepat ---------- */
.qrow.ph{grid-template-columns:58px 1fr 1fr 38px;align-items:start}
.qrow.ph>.qfoto{grid-column:1;grid-row:1/3}
.qrow.ph>[data-f="nama"]{grid-column:2/4;grid-row:1}
.qrow.ph>[data-del]{grid-column:4;grid-row:1}
.qrow.ph>input:nth-child(3){grid-column:2;grid-row:2}
.qrow.ph>input:nth-child(4){grid-column:3;grid-row:2}
.qrow.ph>.qstar{grid-column:4;grid-row:2}
.qfoto{width:58px;height:86px;border-radius:12px;overflow:hidden;background:var(--card);border:2px dashed var(--line);display:grid;place-items:center;cursor:pointer}
.qfoto img{width:100%;height:100%;object-fit:cover}
.qfoto span{display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1}
.qfoto small{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px}
.qfoto.up{border-color:var(--brand)}
.qstar{font-size:18px}.qstar.on{background:#fff1c9}
.fotobtn{background:linear-gradient(135deg,#f0b35a,#b8532a);margin-bottom:12px;display:flex;flex-direction:column;line-height:1.2}
.fotobtn small{font-size:11px;font-weight:600;opacity:.9}
.fmh{margin:14px 0 6px;font-size:15px}
.fmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.fmgrid{grid-template-columns:repeat(4,1fr)}}
.fmc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.fmc.best{border-color:#f0c040;box-shadow:0 0 0 2px #fff1c9}
.fmimg{position:relative;display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--brand-soft);cursor:pointer}
.fmimg img{width:100%;height:100%;object-fit:cover;display:block}
.fmph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:30px}
.fmph small{font-size:10.5px;font-weight:800;color:var(--brand-d);margin-top:4px}
.fmbusy{position:absolute;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:26px;z-index:2}
.fmstar{position:absolute;top:2px;right:2px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);font-size:17px;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.fmn{font-size:12px;font-weight:700;line-height:1.2;margin-top:5px;min-height:29px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fmp{font-size:11px;color:var(--gold);font-weight:800}
.fmdel{font-size:10.5px;color:var(--bad);margin-top:2px}

/* ---------- Pesanan langsung (kasir) ---------- */
.posbtn{background:var(--ink);margin-bottom:12px;display:flex;flex-direction:column;line-height:1.2;padding:14px}
.posbtn small{font-size:11px;font-weight:600;opacity:.8}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:42vh;overflow:auto;padding:4px 2px 8px}
@media(min-width:560px){.posgrid{grid-template-columns:repeat(4,1fr)}}
.posit{position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.posit img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;margin-bottom:3px}
.posit b{font-size:12.5px;line-height:1.2}.posit small{font-size:11.5px;color:var(--gold);font-weight:800}
.posit.sel{border-color:var(--brand);background:#fff6ee}.posit.off{opacity:.45}
.posit:active{transform:scale(.96)}
.poscart{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.poscart h4{margin:4px 0;font-size:15px}
.posempty{text-align:center;color:var(--muted);padding:14px 0;font-size:13px}
.posbtns{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-top:10px}
.posbtns .btn{padding:14px 6px;font-size:14px}
.chk2{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:8px 0}
.chk2 input{width:20px;height:20px;accent-color:var(--ok)}

/* ---------- Foto di tampilan pelanggan ---------- */
.catbox.foto{position:relative;padding:0;overflow:hidden;min-height:140px;border:0;justify-content:flex-end}
.catbox.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.catbox.foto .ov{position:relative;z-index:1;display:block;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(30,18,10,.82));color:#fff;text-align:left}
.catbox.foto .ov b{display:block;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.catbox.foto .ov small{color:#f3e6d6;font-weight:600}
.catbox .ov{display:contents}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .ibox{flex:0 0 140px;scroll-snap-align:start}

/* ---------- Kategori ringkas: 4 kolom di HP, 5 di layar lebar ---------- */
.cats{grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:560px){.cats{grid-template-columns:repeat(5,1fr);gap:8px}}
.catbox{min-height:0;padding:8px 4px 7px;border-radius:14px;gap:0;align-items:center;text-align:center}
.catbox .ic{width:34px;height:34px;font-size:18px;border-radius:10px;margin:0 auto 5px}
.catbox b{font-size:11.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:26px;word-break:break-word}
.catbox small{font-size:10px}
.catbox.foto{min-height:92px;height:100%;padding:0}
.catbox.foto .ov{padding:20px 5px 5px;text-align:left}
.catbox.foto .ov b{font-size:11.5px;min-height:0}
.catbox.foto .ov small{font-size:9.5px}

/* ---------- Daftar menu pelanggan: 5 kolom ringkas ---------- */
#view .items{grid-template-columns:repeat(5,1fr);gap:5px}
#view .ibox{padding:5px 4px 5px;border-radius:10px;min-height:0;gap:1px;border-width:2px}
#view .ibox img{width:calc(100% + 8px);margin:-5px -4px 3px;aspect-ratio:1/1;border-radius:8px 8px 0 0}
#view .ibox .nm{font-size:10px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:23px;word-break:break-word}
#view .ibox .ds{display:none}
#view .ibox .pr{padding-top:1px;min-height:0}
#view .ibox .price{font-size:10.5px}
#view .ibox .habis{font-size:10px}
#view .ibox .sisa{font-size:9.5px}
#view .addbtn{margin-top:3px;padding:5px 0;font-size:15px;border-radius:8px;line-height:1}
#view .qctl{margin-top:3px;padding:1px}
#view .qctl .qb{width:20px;height:24px;font-size:14px;border-radius:7px}
#view .qctl span{font-size:11px}
#view .hscroll .ibox{flex:0 0 92px}
@media(min-width:560px){#view .items{grid-template-columns:repeat(6,1fr)}}

/* ---------- Hubungkan menu ↔ stok ---------- */
.linkbtn2{background:var(--card);color:var(--ink);border:2px solid var(--ok);margin-bottom:12px;display:flex;flex-direction:column;line-height:1.3;padding:12px}
.linkbtn2 small{font-size:11px;color:var(--muted);font-weight:600}
.linkbtn2 .cnt{display:inline-block;background:#f6d6d1;color:var(--bad);border-radius:99px;padding:1px 8px;font-size:11.5px;margin-left:4px}
.linkbtn2 .cnt.ok{background:var(--ok-soft);color:var(--ok)}
.hrow{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.hrow.sar{background:#fffbea;border-color:#f0d58a}
.hrow.chg{border-left:4px solid var(--ok)}
.hrow .hn b{font-size:13.5px;display:block}
.hrow .hn small{display:block;font-size:11px;color:var(--muted)}
.hrow select{padding:8px 6px;font-size:13px}
.sarantag{display:inline-block;background:#f7e7b4;color:#6b4e09;font-size:10.5px;font-weight:800;border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:middle}
.cmh{margin:14px 0 6px;font-size:15px}
.cmrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
.cmrow.warn{background:var(--warn-soft)}
.cmt b{font-size:14px}.cmt small{display:block;color:var(--muted);font-size:11.5px}
.cmwarn{background:var(--warn-soft);border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px}
.cmok{background:var(--ok-soft);color:#1f5a37;border-radius:12px;padding:10px;font-size:13px}
.qrow.b2{grid-template-columns:1fr 1fr 38px}
.qrow.b2>[data-f="nama"]{grid-column:1/3;grid-row:1}
.qrow.b2>[data-del]{grid-column:3;grid-row:1}
.qrow.b2>[data-f="satuan"]{grid-column:1;grid-row:2}
.qrow.b2>[data-f="stok"]{grid-column:2;grid-row:2}
.qrow.b2>[data-f="harga"]{grid-column:1/3;grid-row:3}
.qrow.b2>.qi{grid-column:1/4;grid-row:4}
.qinfo{font-size:11.5px;color:var(--muted);margin-top:2px}
.qinfo.ok{color:var(--ok);font-weight:700}.qinfo.warn{color:#7a5210;font-weight:700}

/* ---------- Laporan gambar ---------- */
.lgimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:10px;box-shadow:var(--shadow)}
.lapbtn a.btn{text-decoration:none;text-align:center}
.pdfsteps{margin:6px 0 10px;padding-left:20px;line-height:1.7;font-size:14px}

/* ---------- Struk ---------- */
#printArea{display:none}
.struk{font-family:"Courier New",Courier,monospace;color:#000;background:#fff;font-size:12px;line-height:1.35;margin:0 auto;padding:6px 4px}
.struk.w58{width:48mm}.struk.w80{width:72mm;font-size:13px}
.struk .slogo{display:block;width:60%;max-width:34mm;margin:0 auto 4px;filter:grayscale(1) contrast(1.4)}
.struk .sc{text-align:center}.struk .sb{font-weight:700}.struk .sbig{font-size:1.15em}
.struk .sr{display:flex;justify-content:space-between;gap:6px}
.struk .sr span:last-child{text-align:right;white-space:nowrap}
.struk .si{margin-top:2px}.struk .snote{font-size:.9em}
.struk .sline{border-top:1px dashed #000;margin:5px 0}
.struk-preview{background:#e9e2d6;border-radius:14px;padding:14px 8px;margin:10px 0 14px;overflow:auto}
.struk-preview .struk{box-shadow:0 4px 14px rgba(0,0,0,.15)}
.sbtn{margin-left:auto}
@media print{
  body.print-struk > *:not(#printArea){display:none!important}
  body.print-struk{background:#fff!important;margin:0}
  body.print-struk #printArea{display:block!important}
  body.print-struk .struk{box-shadow:none;margin:0}
}
</style>

function emojiFor(it){
  var n=(it.nama+' '+it.kategori).toLowerCase();
  if(/kopi|coffee|espresso|latte/.test(n)) return '☕';
  if(/teh|tea/.test(n)) return '🍵';
  if(/jeruk|jus|juice|es |soda|minum/.test(n)) return '🥤';
  if(/susu|milk/.test(n) && !/roti/.test(n)) return '🥛';
  if(/mie|indomie|bakmi/.test(n)) return '🍜';
  if(/nasi|rice/.test(n)) return '🍛';
  if(/roti|bread|toast/.test(n)) return '🍞';
  if(/pisang/.test(n)) return '🍌';
  if(/kentang|goreng|snack|cemil/.test(n)) return '🍟';
  return '🍽️';
}

}

var MODE, MEJA;
function readRoute(){
  if (IS_GAS) { MODE = tplVal(boot.mode) || 'menu'; MEJA = tplVal(boot.meja); return; }
  if (USE_API) {
    var q = new URLSearchParams(location.search);
    MEJA = (q.get('meja')||'').replace(/[^\w-]/g,'').slice(0,10);
    MODE = (q.has('meja') || q.has('menu')) ? 'menu' : 'admin';
    return;
  }
  var h = '';
  try { h = (location.hash||'').replace('#',''); } catch(e){}
  MODE = h === 'admin' ? 'admin' : 'menu';
  var m = h.match(/^meja-(\w+)$/); MEJA = m ? m[1] : '5';
  drawDemoBar();
}
/* Tombol pratinjau: pakai tombol biasa (bukan link) agar bisa diketuk di aplikasi Claude */
function drawDemoBar(){
  var bar = $('#demobar'); bar.classList.remove('hidden');
  bar.innerHTML = '<span>Pratinjau:</span>' +
    '<button type="button" data-mode="menu" class="'+(MODE==='menu'?'on':'')+'">Pelanggan</button>' +
    '<button type="button" data-mode="admin" class="'+(MODE==='admin'?'on':'')+'">Owner / Kasir</button>';
}
function switchMode(mode){
  if (IS_GAS || USE_API || mode===MODE) return;
  stopPolling(); while (document.querySelector('.scrim')) closeSheet();
  MODE = mode; if (mode==='menu') C.view='home';
  drawDemoBar(); start(); window.scrollTo(0,0);
}
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('#demobar [data-mode]');
  if (b){ e.preventDefault(); switchMode(b.dataset.mode); }
});

/* =====================================================================
   4. HALAMAN PELANGGAN  (tampilan simpel: kotak kategori → daftar menu)
   ===================================================================== */
var C = { data:null, cart:{}, view:'home', cat:'', q:'' };
var BEST = '⭐ Best Seller';

function logoSrc(s){ return (s && s.logo_url) || DEFAULT_LOGO; }
function catIcon(c){
  var n=String(c).toLowerCase();
  if(/best/.test(n)) return '⭐';
  if(/dingin|^es\b|\bes\b|ice|cold/.test(n)) return '🧊';
  if(/panas|hangat|hot/.test(n)) return '☕';
  if(/kopi|coffee/.test(n)) return '☕';
  if(/minum|drink|jus|juice/.test(n)) return '🥤';
  if(/mie|indomie|bakmi|mi\b/.test(n)) return '🍜';
  if(/nasi|rice/.test(n)) return '🍛';
  if(/roti|snack|cemil|gorengan|camilan/.test(n)) return '🍞';
  if(/paket|promo/.test(n)) return '🎁';
  return '🍽️';
}
function catTone(c){
  var n=String(c).toLowerCase();
  if(/best/.test(n)) return 'gold';
  if(/dingin|\bes\b|ice|cold/.test(n)) return 'cold';
  if(/panas|hangat|hot|kopi/.test(n)) return 'hot';
  return '';
}

function startCustomer(){
  C.cart = store('cart') || {};
  var last = store('lastOrder');
  api('getPublicData').then(function(d){
    C.data = d;
    document.title = d.settings.nama_warkop || 'Menu';
    setFavicon(logoSrc(d.settings));
    if (last && last.no) renderDone(last); else renderMenu();
  }).catch(function(e){ $('#app').innerHTML='<div class="wrap empty">Gagal memuat menu.<br>'+esc(e.message)+'<br><br><button class="btn" onclick="location.reload()">Coba lagi</button></div>'; });
}

function categories(){
  var seen={}, out=[];
  C.data.menu.forEach(function(m){ if(!seen[m.kategori]){ seen[m.kategori]=1; out.push(m.kategori); } });
  return out;
}
/* Foto untuk kotak kategori: utamakan foto menu Best Seller, lalu menu lain yang berfoto */
function catFoto(cat){
  var xs=itemsOf(cat).filter(function(m){ return m.foto; });
  var best=xs.filter(function(m){ return m.bestSeller; });
  return (best[0] || xs[0] || {}).foto || '';
}
function itemsOf(cat){
  return C.data.menu.filter(function(m){ return cat===BEST ? m.bestSeller : m.kategori===cat; });
}
function findItem(id){ return C.data.menu.filter(function(m){ return m.id===id; })[0]; }

function renderMenu(){
  var s = C.data.settings;
  $('#app').innerHTML =
    '<div class="wrap">' +
      '<header class="hero2">' +
        '<img class="logo" src="'+esc(logoSrc(s))+'" alt="Logo">' +
        '<div><h1 class="serif">'+esc(s.nama_warkop)+'</h1>' +
        (s.tagline ? '<p>'+esc(s.tagline)+'</p>' : '') +
        (MEJA ? '<div class="meja-pill">📍 Meja <b>'+esc(MEJA)+'</b></div>' : '') + '</div>' +
      '</header>' +
      (!s.pesan_aktif ? '<div class="closed-note">Pemesanan lewat HP sedang ditutup. Silakan pesan langsung ke kasir 🙏</div>' : '') +
      ((s.diskon||[]).length && s.pesan_aktif ? '<div class="promo">🏷️ <b>PROMO:</b> '+esc(promoText(s.diskon))+'</div>' : '') +
      '<label class="search" style="margin-top:12px"><span>🔎</span><input id="q" type="search" placeholder="Cari menu…" value="'+esc(C.q)+'"></label>' +
      '<main id="view"></main>' +
      '<div class="spacer"></div>' +
    '</div>' +
    '<div class="cartbar hidden" id="cartbar"><div class="inner"><div><div class="cnt" id="cbCnt"></div><div class="tot" id="cbTot"></div></div><button class="go" id="cbGo">Lihat Pesanan →</button></div></div>';

  $('#q').addEventListener('input', function(e){ C.q=e.target.value; renderView(); });
  $('#view').addEventListener('click', onViewClick);
  $('#cbGo').addEventListener('click', openCart);
  renderView(); renderCartBar();
}

function renderView(){
  var el=$('#view'), q=C.q.trim().toLowerCase();
  if (q){
    var xs=C.data.menu.filter(function(m){ return (m.nama+' '+m.kategori+' '+m.deskripsi).toLowerCase().indexOf(q)>=0; });
    el.innerHTML='<div class="vhead"><h2 class="serif">Hasil pencarian</h2></div>'+itemsGrid(xs);
    return;
  }
  var cats = (C.data.menu.some(function(m){return m.bestSeller;}) ? [BEST] : []).concat(categories());
  if (C.view==='cat' && cats.indexOf(C.cat)>=0){
    el.innerHTML =
      '<div class="vhead"><button class="back" data-back>←</button><h2 class="serif">'+catIcon(C.cat)+' '+esc(C.cat.replace('⭐ ',''))+'</h2></div>' +
      '<div class="chips">'+cats.map(function(c){ return '<button class="chip'+(c===C.cat?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')+'</div>' +
      itemsGrid(itemsOf(C.cat));
    var on=el.querySelector('.chip.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
    return;
  }
  C.view='home';
  // Menu paling laris dengan foto (geser ke samping)
  var laris = C.data.menu.filter(function(m){ return m.bestSeller && avail(m); });
  var larisFoto = laris.filter(function(m){ return m.foto; }).length;
  el.innerHTML = (laris.length && larisFoto ? '<div class="sub">⭐ Paling Laris</div><div class="hscroll">'+laris.slice(0,12).map(itemBox).join('')+'</div>' : '') +
    '<div class="sub">Mau pesan apa hari ini?</div><div class="cats">' + cats.map(function(c){
    var n=itemsOf(c).length, foto=catFoto(c);
    if (foto) return '<button class="catbox foto" data-cat="'+esc(c)+'"><img src="'+esc(foto)+'" alt="" loading="lazy" onerror="this.parentNode.classList.remove(\'foto\');this.remove()"><span class="ov"><b>'+esc(c.replace('⭐ ',''))+'</b><small>'+n+' menu</small></span></button>';
    return '<button class="catbox '+catTone(c)+'" data-cat="'+esc(c)+'"><span class="ic">'+catIcon(c)+'</span><b>'+esc(c.replace('⭐ ',''))+'</b><small>'+n+' menu</small></button>';
  }).join('') + '</div>';
}

function itemsGrid(xs){
  if (!xs.length) return '<div class="empty">Menu tidak ditemukan.</div>';
  return '<div class="items">'+xs.map(itemBox).join('')+'</div>' +
    (C.data.settings.pesan_aktif ? '<p class="tip">Tekan ＋ untuk memasukkan ke pesanan</p>' : '');
}

function itemBox(m){
  var qty = C.cart[m.id] ? C.cart[m.id].qty : 0;
  return '<div class="ibox'+(qty?' sel':'')+(avail(m)?'':' off')+'" data-item="'+m.id+'" role="button">' +
    (m.foto ? '<img src="'+esc(m.foto)+'" alt="" loading="lazy" onerror="this.remove()">' : '') +
    '<div class="nm">'+(m.bestSeller?'⭐ ':'')+esc(m.nama)+'</div>' +
    (m.deskripsi ? '<div class="ds">'+esc(m.deskripsi)+'</div>' : '') +
    '<div class="pr">'+(avail(m) ? '<span class="price">'+rp(m.harga)+'</span>' : '<span class="habis">Habis</span>')+'</div>' +
    (avail(m) && hasStok(m) && Number(m.stok)<=5 ? '<div class="sisa">Sisa '+Number(m.stok)+'</div>' : '') +
    (C.data.settings.pesan_aktif && avail(m) ?
      (qty ? '<div class="qctl"><button class="qb minus2" data-dec="'+m.id+'" aria-label="Kurangi">−</button><span>'+qty+'</span><button class="qb plus" data-inc="'+m.id+'" aria-label="Tambah">+</button></div>'
           : '<button class="addbtn" data-inc="'+m.id+'" aria-label="Tambah">＋</button>') : '') +
  '</div>';
}

function onViewClick(e){
  var t;
  if ((t=e.target.closest('[data-back]'))){ C.view='home'; renderView(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if ((t=e.target.closest('[data-cat]'))){ C.view='cat'; C.cat=t.dataset.cat; renderView(); if(t.classList.contains('catbox')) window.scrollTo({top:$('#view').offsetTop-10,behavior:'smooth'}); return; }
  if ((t=e.target.closest('[data-dec]'))){ e.stopPropagation(); changeQty(t.dataset.dec,-1); return; }
  if ((t=e.target.closest('[data-inc]'))){ e.stopPropagation(); changeQty(t.dataset.inc,1); return; }
  if ((t=e.target.closest('[data-item]'))){
    var m=findItem(t.dataset.item); if(!m) return;
    if (!C.data.settings.pesan_aktif){ toast('Pemesanan lewat HP sedang ditutup'); return; }
    if (!avail(m)){ toast('Maaf, '+m.nama+' sedang habis', true); return; }
    changeQty(m.id, 1); toast('+1 '+m.nama);
  }
}

function changeQty(id, d){
  var cur = C.cart[id] || {id:id, qty:0, note:''};
  var it = findItem(id), max = it && hasStok(it) ? Number(it.stok) : 99;
  if (it && it.resep && it.resep.length && C.data.bahan){ (it.resep||[]).forEach(function(r){ var tot=[r.b].concat(r.alt).reduce(function(a,id2){ var b=C.data.bahan.filter(function(x){ return x.id===id2; })[0]; return a+(b?Math.max(0,b.stok):0); },0); max=Math.min(max, Math.floor(tot/(r.q||1))); }); }
  if (d>0 && cur.qty>=max){ toast('Stok '+it.nama+' tinggal '+max, true); return; }
  cur.qty = Math.min(max, cur.qty + d);
  if (cur.qty<=0) delete C.cart[id]; else C.cart[id]=cur;
  store('cart', C.cart);
  Array.prototype.forEach.call(document.querySelectorAll('[data-item="'+id+'"]'), function(box){
    var tmp=document.createElement('div'); tmp.innerHTML=itemBox(findItem(id)); box.replaceWith(tmp.firstChild);
  });
  renderCartBar();
}

function variantHtml(it, c){
  var bahan=C.data.bahan||[], h='';
  (it.resep||[]).forEach(function(r){
    if (!r.alt || !r.alt.length) return;
    var opts=[r.b].concat(r.alt).map(function(id){ return bahan.filter(function(b){ return b.id===id; })[0]; }).filter(Boolean);
    if (opts.length<2) return;
    var cur=(c.pilih && c.pilih[r.b]) || r.b;
    h += '<label class="variant"><span>Pakai:</span><select data-var="'+it.id+'" data-base="'+r.b+'">'+opts.map(function(b){ return '<option value="'+b.id+'"'+(b.id===cur?' selected':'')+(b.stok<r.q*c.qty?' disabled':'')+'>'+esc(b.nama)+(b.stok<r.q*c.qty?' (habis)':'')+'</option>'; }).join('')+'</select></label>';
  });
  return h;
}
function variantNote(it, pilih){
  var out=[]; (it.resep||[]).forEach(function(r){ if(pilih && pilih[r.b] && pilih[r.b]!==r.b){ var b=(C.data.bahan||[]).filter(function(x){ return x.id===pilih[r.b]; })[0]; if(b) out.push('pakai '+b.nama); } }); return out;
}
function nextPromo(sub, rules){
  var nx=(rules||[]).filter(function(r){ return r.min>sub; }).sort(function(a,b){ return a.min-b.min; })[0];
  return nx ? '<div class="discline hint2">🏷️ Tambah <b>'+rp(nx.min-sub)+'</b> lagi untuk dapat diskon '+nx.persen+'%</div>' : '';
}
function cartTotals(){
  var n=0,t=0; Object.keys(C.cart).forEach(function(id){ var it=findItem(id); if(!it){ delete C.cart[id]; return; } n+=C.cart[id].qty; t+=C.cart[id].qty*it.harga; });
  return {n:n,t:t};
}
function renderCartBar(){
  var t=cartTotals(), bar=$('#cartbar'); if(!bar) return;
  bar.classList.toggle('hidden', !t.n);
  $('#cbCnt').textContent = t.n+' ITEM'; $('#cbTot').textContent = rp(t.t);
}

function payMethods(s){
  var m=[];
  if (s.bayar_cash!==false) m.push('Cash');
  if (s.bayar_qris) m.push('QRIS');
  if (s.bayar_transfer) m.push('Transfer');
  if (!m.length) m.push('Cash');
  return m;
}
var PAY_ICON = {Cash:'💵', QRIS:'📱', Transfer:'🏦'};
function openCart(){
  var s = C.data.settings;
  var info = store('custInfo') || {};
  var methods = payMethods(s), metode = methods.indexOf(info.metode)>=0 ? info.metode : methods[0];
  var sh = openSheet('<h3 class="serif">Pesanan Kamu</h3><div id="clines"></div>' +
    '<div id="cdisk"></div><div class="sumrow"><span>Total</span><span class="price" id="ctot"></span></div>' +
    '<label class="field"><span>NOMOR MEJA *</span><input class="input" id="cmeja" inputmode="numeric" maxlength="10" placeholder="cth: 5" value="'+esc(MEJA||info.meja||'')+'"'+(MEJA?' readonly':'')+'></label>' +
    '<label class="field"><span>NAMA (opsional)</span><input class="input" id="cnama" maxlength="40" placeholder="Biar kasir gampang panggil" value="'+esc(info.nama||'')+'"></label>' +
    '<label class="field"><span>CATATAN UNTUK DAPUR (opsional)</span><textarea class="input" id="ccat" maxlength="200" placeholder="cth: minumannya duluan"></textarea></label>' +
    '<div class="field"><span>METODE PEMBAYARAN *</span><div class="paygrid" id="cpay">' +
      methods.map(function(m){ return '<button type="button" data-m="'+m+'" class="'+(m===metode?'on':'')+'"><i>'+PAY_ICON[m]+'</i>'+m+'</button>'; }).join('') +
    '</div></div>' +
    '<div id="cpayinfo"></div>' +
    '<button class="btn block" id="csend">Kirim Pesanan</button>');
  function total(){ var sub=cartTotals().t; return sub - hitungDiskon(sub, s.diskon||[]).nominal; }
  function drawPay(){
    var t=rp(total()), h='';
    if (metode==='Cash') h = '<div class="paynote">💵 '+esc(s.catatan_bayar || 'Bayar tunai di kasir.')+'</div>';
    if (metode==='QRIS') h = '<div class="paybox"><b>Scan QRIS di bawah, lalu bayar tepat <span class="price">'+t+'</span></b>' +
        (s.bayar_qris_url ? '<img class="qrisimg" src="'+esc(s.bayar_qris_url)+'" alt="QRIS">' : '<div class="closed-note">Gambar QRIS belum diatur. Minta QRIS ke kasir.</div>') +
        '<label class="paid"><input type="checkbox" id="cpaid"><span>Saya <b>sudah membayar</b> '+t+' lewat QRIS</span></label></div>';
    if (metode==='Transfer') h = '<div class="paybox"><b>Transfer tepat <span class="price">'+t+'</span> ke:</b>' +
        '<div class="tfinfo">'+(s.bayar_transfer_info ? esc(s.bayar_transfer_info).replace(/\n/g,'<br>') : 'Info rekening belum diatur. Tanya ke kasir.')+'</div>' +
        '<label class="paid"><input type="checkbox" id="cpaid"><span>Saya <b>sudah transfer</b> '+t+'</span></label></div>';
    $('#cpayinfo',sh).innerHTML = h;
  }
  function draw(){
    cartTotals(); var ids=Object.keys(C.cart);
    if(!ids.length){ closeSheet(); return; }
    $('#clines',sh).innerHTML = ids.map(function(id){
      var it=findItem(id), c=C.cart[id];
      return '<div class="line"><div class="info"><b>'+esc(it.nama)+'</b><span class="muted">'+rp(it.harga)+'</span>' + variantHtml(it, c) +
        '<input class="input" style="padding:7px 10px;font-size:13px" data-note="'+id+'" maxlength="80" placeholder="+ catatan (pedas, tanpa es, gula sedikit…)" value="'+esc(c.note)+'"></div>' +
        '<div class="step"><button data-d="-1" data-id="'+id+'">−</button><span>'+c.qty+'</span><button data-d="1" data-id="'+id+'">+</button></div></div>';
    }).join('');
    var sub=cartTotals().t, dk=hitungDiskon(sub, s.diskon||[]);
    $('#ctot',sh).innerHTML = dk.nominal ? '<s class="muted" style="font-size:14px;font-weight:600">'+rp(sub)+'</s> '+rp(sub-dk.nominal) : rp(sub);
    $('#cdisk',sh).innerHTML = dk.nominal ? '<div class="discline">🏷️ '+esc(dk.ket)+' <b>−'+rp(dk.nominal)+'</b></div>'
      : ((s.diskon||[]).length ? nextPromo(sub, s.diskon) : '');
    drawPay();
  }
  draw();
  $('#cpay',sh).onclick=function(e){ var b=e.target.closest('[data-m]'); if(!b) return; metode=b.dataset.m; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); drawPay(); };
  $('#clines',sh).addEventListener('click', function(e){ var b=e.target.closest('[data-d]'); if(!b) return; changeQty(b.dataset.id, Number(b.dataset.d)); draw(); });
  $('#clines',sh).addEventListener('input', function(e){ var id=e.target.dataset.note; if(id && C.cart[id]){ C.cart[id].note=e.target.value; store('cart',C.cart); } });
  $('#clines',sh).addEventListener('change', function(e){ var id=e.target.dataset.var; if(!id || !C.cart[id]) return; C.cart[id].pilih=C.cart[id].pilih||{}; C.cart[id].pilih[e.target.dataset.base]=e.target.value; store('cart',C.cart); });
  $('#csend',sh).onclick = function(){
    var meja=$('#cmeja',sh).value.trim(), nama=$('#cnama',sh).value.trim();
    if(!meja){ toast('Isi nomor meja dulu ya', true); $('#cmeja',sh).focus(); return; }
    if (metode!=='Cash' && !($('#cpaid',sh) && $('#cpaid',sh).checked)){ toast('Selesaikan pembayaran '+metode+' dulu, lalu centang "sudah membayar"', true); return; }
    var btn=this; btn.disabled=true; btn.textContent='Mengirim…';
    store('custInfo', {meja:meja, nama:nama, metode:metode});
    var payload={meja:meja,nama:nama,metode:metode,catatan:$('#ccat',sh).value.trim(),items:Object.keys(C.cart).map(function(id){ return {id:id,qty:C.cart[id].qty,note:(C.cart[id].note||'').trim(),pilih:C.cart[id].pilih||{}}; })};
    api('submitOrder', payload).then(function(r){
      var snapshot={id:r.id,no:r.no,total:r.total,subtotal:r.subtotal,diskon:r.diskon,ketDiskon:r.ketDiskon,meja:meja,nama:nama,metode:r.metode||metode,items:payload.items.map(function(x){ var it=findItem(x.id); return {nama:it.nama,qty:x.qty,note:[x.note].concat(variantNote(it,x.pilih)).filter(String).join(', ')}; })};
      C.cart={}; store('cart',{}); store('lastOrder', snapshot);
      closeSheet(); renderDone(snapshot);
    }).catch(function(e){ btn.disabled=false; btn.textContent='Kirim Pesanan'; toast(e.message, true); });
  };
}
var statusTimer;
function renderDone(o){
  window.scrollTo(0,0);
  var metode = o.metode || 'Cash';
  $('#app').innerHTML = '<div class="wrap done">' +
    '<img src="'+esc(logoSrc(C.data.settings))+'" alt="" style="width:84px;height:84px"><div class="eyebrow" style="color:var(--ok);font-weight:800;letter-spacing:.15em;font-size:12px">✓ PESANAN TERKIRIM</div>' +
    '<h1 class="serif" style="margin:6px 0 0">Terima kasih'+(o.nama?', '+esc(o.nama):'')+'!</h1>' +
    '<div class="ticket"><div class="muted" style="text-align:center;font-weight:700;font-size:12px;letter-spacing:.1em">NOMOR PESANAN</div>' +
      '<div class="no">'+esc(o.no)+'</div>' +
      '<div style="text-align:center;margin-top:6px" class="muted">Meja <b style="color:var(--ink)">'+esc(o.meja)+'</b></div>' +
      '<div class="track" id="track"></div>' +
      '<div style="border-top:1px dashed var(--line);margin-top:14px;padding-top:10px">' +
      o.items.map(function(i){ return '<div style="display:flex;gap:8px;padding:3px 0"><b>'+i.qty+'×</b><span>'+esc(i.nama)+(i.note?'<br><small class="muted">'+esc(i.note)+'</small>':'')+'</span></div>'; }).join('') +
      (o.diskon ? '<div class="discline">🏷️ '+esc(o.ketDiskon||'Diskon')+' <b>−'+rp(o.diskon)+'</b></div>' : '') +
      '<div class="sumrow"><span>Total</span><span class="price">'+rp(o.total)+'</span></div></div>' +
      '<div class="paynote" style="margin:0" id="paystat">'+PAY_ICON[metode]+' '+esc(metode)+'</div>' +
    '</div>' +
    '<button class="btn" id="again">+ Pesan Lagi</button></div>';
  $('#again').onclick = function(){ clearInterval(statusTimer); store('lastOrder', null); C.view='home'; renderMenu(); };
  function paint(s, sb){
    if (s==='Batal'){ $('#track').innerHTML='<div class="closed-note" style="flex:1;text-align:center">Pesanan dibatalkan kasir. Silakan tanya ke kasir.</div>'; return; }
    var steps=['Baru','Diproses','Selesai'], label=['Diterima','Dibuat','Siap / Diantar'], idx=Math.max(0,steps.indexOf(s));
    $('#track').innerHTML = steps.map(function(x,i){ return '<div class="'+(i<=idx?'on':'')+'"><i>'+(i<=idx?'✓':i+1)+'</i>'+label[i]+'</div>'; }).join('');
    var p = sb==='Lunas' ? '✅ <b>Pembayaran '+esc(metode)+' diterima (LUNAS)</b>'
          : metode==='Cash' ? '💵 Bayar <b>tunai di kasir</b>'
          : '⏳ Pembayaran '+esc(metode)+' <b>sedang dicek kasir</b>';
    $('#paystat').innerHTML = p;
    if (s==='Selesai' && sb==='Lunas') clearInterval(statusTimer);
  }
  paint('Baru', '');
  clearInterval(statusTimer);
  function poll(){
    if (o.id) api('getOrderInfo', o.id).then(function(r){ if(r) paint(r.status, r.statusBayar); }).catch(function(){});
    else api('getOrderStatus', o.no).then(function(s){ if(s) paint(s, ''); }).catch(function(){});
  }
  poll(); statusTimer = setInterval(poll, 10000);
}

var audioCtx;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){} }
function ding(){
  try{ if(!audioCtx) return; [880,1320].forEach(function(f,i){ var o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); var t=audioCtx.currentTime+i*0.18; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35); o.start(t); o.stop(t+0.4); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function pollOrders(){
  api('adminGetOrders', A.pin).then(function(list){
    var fresh = list.filter(function(o){ return !A.seen[o.id]; });
    A.data.orders = list;
    if (fresh.length){ fresh.forEach(function(o){ A.seen[o.id]=1; o._fresh=1; }); ding(); toast('🔔 '+fresh.length+' pesanan baru masuk!'); }
    if (A.tab==='pesanan' && !document.querySelector('.scrim')) renderTab(); else renderTabsBar();
  }).catch(function(){});
}

/* ---------- Tab Pesanan ---------- */
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function isLunas(o){ return o.status!=='Batal' && o.statusBayar==='Lunas'; }
function findOrderLocal(id){ return A.data.orders.filter(function(x){ return x.id===id; })[0]; }
function payChip(o){
  var sb=o.statusBayar||'Belum';
  var cls= sb==='Lunas'?'ok':sb==='Cek'?'cek':'blm';
  var txt= sb==='Lunas'?'LUNAS'+(o.nominal && o.nominal!==o.total?' '+rp(o.nominal):''):sb==='Cek'?'CEK BAYAR':'BELUM BAYAR';
  return '<span class="pchip '+cls+'">'+PAY_ICON[o.metode||'Cash']+' '+esc(o.metode||'Cash')+' · '+txt+'</span>';
}
function tabOrders(){

  var by={Cash:0,QRIS:0,Transfer:0}, omzet=0;

  var shown = os.filter(function(o){ return A.filter==='semua' ? true : A.filter==='aktif' ? (o.status==='Baru'||o.status==='Diproses'||(o.status==='Selesai'&&o.statusBayar!=='Lunas')) : o.status==='Selesai'||o.status==='Batal'; });

    '<div class="bymet">'+['Cash','QRIS','Transfer'].map(function(m){ return '<span>'+PAY_ICON[m]+' '+m+' <b>'+rp(by[m]||0)+'</b></span>'; }).join('')+'</div>' +
    '<div class="seg" id="seg">'+[['aktif','Aktif'],['selesai','Selesai'],['semua','Semua']].map(function(x){ return '<button data-f="'+x[0]+'" class="'+(A.filter===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</div>' +
    (shown.length ? shown.map(orderCard).join('') : '<div class="empty">Belum ada pesanan '+(A.filter==='aktif'?'aktif':'')+' hari ini.<br><small>Halaman ini cek pesanan baru otomatis tiap 8 detik.</small></div>');

function updOrder(id, patch, btn, msg){

function orderCard(o){

/* Lembar "Selesai & Bayar": pilih metode, hitung kembalian */

    '<div id="cashbox"><label class="field"><span>UANG DARI PELANGGAN (untuk hitung kembalian)</span><input class="input" id="pu" inputmode="numeric" placeholder="cth: 50000"></label>' +
      '<div class="quick" id="pq">'+[o.total,10000,20000,50000,100000].filter(function(v,i,a){ return v>=o.total && a.indexOf(v)===i; }).map(function(v){ return '<button type="button" data-v="'+v+'">'+rp(v)+'</button>'; }).join('')+'</div>' +
      '<div class="kembali" id="pk"></div></div>' +
    (isOwner() ? '<label class="field"><span>TOTAL DISKON / POTONGAN (Rp) — harga awal '+rp(o.subtotal||o.total)+'</span><input class="input" id="pd" inputmode="numeric" value="'+(o.diskon||0)+'"></label>' +
      '<label class="field"><span>NOMINAL MASUK KE OMZET</span><input class="input" id="pn" inputmode="numeric" value="'+o.total+'"></label>' : '') +
    '<button class="btn block" id="pok" style="background:var(--ok)">✓ '+(o.status==='Selesai'?'Simpan: LUNAS':'Selesai & LUNAS')+'</button>' +
    (o.status!=='Selesai' ? '<button class="btn ghost block" style="margin-top:10px" id="pbelum">Selesai, tapi BELUM bayar</button>' : ''));
  function cashUI(){ $('#cashbox',sh).style.display = metode==='Cash' ? '' : 'none'; }
  function tagihan(){ if(!$('#pd',sh)) return o.total; var dk=parseInt(($('#pd',sh).value||'').replace(/\D/g,''),10)||0; return Math.max(0,(o.subtotal||o.total)-dk); }
  function kemb(){ var u=parseInt(($('#pu',sh).value||'').replace(/\D/g,''),10)||0; var k=u-tagihan();
    $('#pk',sh).innerHTML = u ? (k>=0 ? 'Kembalian: <b>'+rp(k)+'</b>' : '<span style="color:var(--bad)">Uang kurang '+rp(-k)+'</span>') : ''; }

/* Ubah / hapus pesanan (khusus Owner). onDone dipanggil setelah berhasil (dipakai tab Kas). */
function editOrder(id, src, onDone){

    '<div class="field"><span>STATUS PESANAN</span><div class="seg" id="es" style="margin:0;flex-wrap:wrap">'+['Baru','Diproses','Selesai','Batal'].map(function(x){ return '<button type="button" data-v="'+x+'" class="'+(x===st?'on':'')+'">'+x+'</button>'; }).join('')+'</div></div>' +
    '<button class="btn block" id="esave">Simpan Perubahan</button>' +
    '<button class="btn danger block" style="margin-top:10px" id="edel">🗑️ Hapus Pesanan Ini</button>');
  function seg(sel, cb){ $(sel,sh).onclick=function(e){ var b=e.target.closest('[data-v]'); if(!b) return; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); cb(b.dataset.v); }; }
  seg('#em', function(v){ metode=v; }); seg('#eb', function(v){ sb=v; }); seg('#es', function(v){ st=v; });
  $('#esave',sh).onclick=function(){

  };
  $('#edel',sh).onclick=function(){

      api('adminDeleteOrder', A.pin, o.id).then(function(){
        if (A.data && A.data.orders) A.data.orders = A.data.orders.filter(function(x){ return x.id!==o.id; });
        closeSheet(); toast('Pesanan dihapus');

function resizeImage(file, max, type){
  return new Promise(function(res, rej){
    var fr=new FileReader();
    fr.onload=function(){ var img=new Image(); img.onload=function(){
      var s=Math.min(1, max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(type==='image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.82));
    }; img.onerror=function(){ rej(new Error('Foto tidak bisa dibaca')); }; img.src=fr.result; };
    fr.onerror=function(){ rej(new Error('Foto tidak bisa dibaca')); }; fr.readAsDataURL(file);
  });
}

/* ---------- Diskon (hitungan sama persis dengan server) ---------- */
function hitungDiskon(sub, rules){
  var best={nominal:0, ket:''};
  (rules||[]).forEach(function(r){
    if (sub < r.min) return;
    var n=Math.floor(sub*r.persen/100); if (r.maks && n>r.maks) n=r.maks;
    if (n>best.nominal) best={nominal:n, ket:'Diskon '+r.persen+'%'+(r.min?' (belanja min '+rp(r.min)+')':'')};
  });
  return best;
}
function promoText(rules){
  return (rules||[]).map(function(r){ return (r.min?'Belanja min '+rp(r.min)+' → ':'')+'diskon '+r.persen+'%'+(r.maks?' (maks '+rp(r.maks)+')':''); }).join(' · ');
}

function lapData(d){
  var c=kasCalc(d.orders, d.entries);
  var menu={}, diskon=0;
  d.orders.forEach(function(o){
    // hanya pesanan LUNAS, supaya total per menu sama dengan uang penjualan
    if (o.status==='Batal' || o.statusBayar!=='Lunas') return;
    diskon += (o.diskon||0);
    o.items.forEach(function(i){ var k=i.nama; var x=menu[k]=menu[k]||{nama:k,qty:0,rp:0}; x.qty+=Number(i.qty)||0; x.rp+=(Number(i.qty)||0)*(Number(i.harga)||0); });
  });
  var jual=Object.keys(menu).map(function(k){ return menu[k]; }).sort(function(a,b){ return b.qty-a.qty || a.nama.localeCompare(b.nama); });
  var keluar={};
  var belanja=[];
  d.entries.forEach(function(e){ if(e.jenis!=='Pengeluaran') return; if(isBelanja(e)){ belanja.push(e); return; } var x=keluar[e.kategori]=keluar[e.kategori]||{kat:e.kategori,n:0,rp:0,cat:[]}; x.n++; x.rp+=e.nominal; if(e.catatan) x.cat.push(e.catatan); });
  var masukLain={};
  d.entries.forEach(function(e){ if(e.jenis!=='Pemasukan') return; var x=masukLain[e.kategori]=masukLain[e.kategori]||{kat:e.kategori,rp:0}; x.rp+=e.nominal; });
  return {c:c, jual:jual, diskon:diskon, belanja:belanja.sort(function(a,b){ return a.tanggal.localeCompare(b.tanggal); }), saldo:saldoInfo(d,c), keluar:Object.keys(keluar).map(function(k){ return keluar[k]; }).sort(function(a,b){ return b.rp-a.rp; }),
          masukLain:Object.keys(masukLain).map(function(k){ return masukLain[k]; }), stok:(d.stok||[])};
}

    y+=110;

      var tq=0, tr=0;

      y+=20; hr(y,'#1d1410'); y+=46; txt('TOTAL', P, y, 30, '800'); txt(String(tq), W-P-260, y, 30, '800', '#1d1410', 'right'); txt(rupiah(tr).replace('Rp',''), W-P, y, 30, '800', '#1d1410', 'right');

        txt(fit((low?'⚠ ':'')+x.nama, cx[0]-P-110, 28, low?'700':'500'), P, y, 28, low?'700':'500', low?'#9a5a00':'#1d1410');
        txt(fmtQty(x.awal), cx[0], y, 28, '500', '#1d1410', 'right'); txt(x.masuk?'+'+fmtQty(x.masuk):'-', cx[1], y, 28, '600', '#2f7d4f', 'right');

      y+=40; txt('⚠ = stok menipis (di bawah batas minimal)', P, y, 22, '500', '#6b5a4c');
    } else { y+=50; txt('Belum ada data stok.', P, y, 28, '500', '#6b5a4c'); }

        b.rincian.forEach(function(x){ row('• '+x.nama+' '+fmtQty(x.jumlah)+(x.satuan?' '+x.satuan:''), rupiah(x.harga), {sz:26, indent:24, gap:40, lcol:'#4a3a2e', rcol:'#4a3a2e'}); }); });
      L.keluar.forEach(function(x){ row(x.kat+(x.n>1?' ('+x.n+'×)':'')+(x.cat.length?' — '+x.cat.slice(0,2).join('; '):''), rupiah(x.rp), {sz:30}); });
      y+=22; hr(y,'#1d1410'); row('Total pengeluaran', rupiah(c.keluar), {bold:true, sz:32, gap:52});
    } else { y+=50; txt('Tidak ada pengeluaran.', P, y, 28, '500', '#6b5a4c'); }

    // Kaki

    txt((s.nama_warkop||'')+' · dibuat dari aplikasi Kasir Warkop', W/2, y, 22, '500', '#9b8a78', 'center');
    y+=40;
    // potong tinggi kanvas sesuai isi

}

function bindDiskonSettings(){
  $('#dsave').onclick=function(){
    var rules=[0,1,2].map(function(i){ var g=function(k){ var el=document.querySelector('[data-r="'+k+'"][data-i="'+i+'"]'); return el?el.value:''; };
      return {min:parseInt(g('min').replace(/\D/g,''),10)||0, persen:parseFloat(g('persen').replace(',','.'))||0, maks:parseInt(g('maks').replace(/\D/g,''),10)||0}; })
      .filter(function(r){ return r.persen>0; });
    if (rules.some(function(r){ return r.persen>100; })){ toast('Diskon maksimal 100%',true); return; }
    var aktif=$('#da').checked;

    api('adminSaveSettings', A.pin, {diskon_aktif:aktif?'TRUE':'FALSE', diskon_aturan:JSON.stringify(rules)}).then(function(ns){ A.data.settings=ns; b.disabled=false; toast('Diskon disimpan ✓'); })

    if ((t=e.target.closest('[data-fd]'))){ var id2=t.dataset.fd, m2=A.data.menu.filter(function(x){ return x.id===id2; })[0]; if(!m2) return;
      confirmBox('Hapus foto '+m2.nama+'?','Hapus').then(function(ok){ if(!ok) return; busy[id2]=1; draw(); saveItem(m2,{foto:''},'Foto dihapus').catch(function(err){ toast(err.message,true); }).then(function(){ delete busy[id2]; draw(); }); });
    }
  });
  // segarkan tab Menu saat lembar ditutup
  var obs=new MutationObserver(function(){ if(!document.body.contains(sh)){ obs.disconnect(); if(A.tab==='menu') tabMenu(); } });
  obs.observe(document.body,{childList:true});
}

    var saran=A.data.menu.map(function(m){ return {m:m,s:mirip(r.nama,m.nama)}; }).filter(function(x){ return x.s>=0.6; }).sort(function(a,c){ return c.s-a.s; })[0];

    return saran ? '<div class="qinfo">ℹ️ Mirip menu "'+esc(saran.m.nama)+'" — bisa dihubungkan lewat 🔗 Hubungkan Menu ↔ Stok</div>' : '<div class="qinfo">Hanya stok (isi harga jual jika ingin jadi menu)</div>';

        '<input class="input" data-f="satuan" list="bsatl" maxlength="15" placeholder="Satuan" value="'+esc(r.satuan)+'">' +
        '<input class="input" data-f="stok" inputmode="numeric" placeholder="Stok sekarang" value="'+esc(r.stok)+'">' +

  $('#br',sh).addEventListener('input', function(e){ var row=e.target.closest('[data-i]'); var f=e.target.dataset.f; if(!row || !f) return; var r=rows[+row.dataset.i];

    var seen={}; for (var i=0;i<list.length;i++){ var k=normFull(list[i].nama); if(seen[k]){ toast('Nama dobel di daftar: '+list[i].nama,true); return; } seen[k]=1; }
    var kat = $('#bk',sh).value==='__new' ? $('#bkn',sh).value.trim() : $('#bk',sh).value;
    if (list.some(function(r){ return r.harga && !bahanMiripDengan(r.nama).length && !menuMiripDengan(r.nama).length; }) && !kat){ toast('Pilih / isi kategori untuk menu baru',true); return; }

        prog.innerHTML='✅ <b>'+hasil.stok+'</b> stok baru'+(hasil.menu?' · <b>'+hasil.menu+'</b> menu baru':'')+(hasil.link?' · <b>'+hasil.link+'</b> dihubungkan ke menu lama':'') +
          (hasil.lewat.length?'<br>⏭️ Dilewati (sudah ada): '+hasil.lewat.map(esc).join(', '):'') + (hasil.gagal.length?'<br>⚠️ Gagal: '+hasil.gagal.map(esc).join(', ')+' — coba lagi':'');
        api('adminGetData', A.pin).then(function(d){ A.data.menu=d.menu; A.data.bahan=d.bahan||[]; if (A.tab==='stok') tabStok(); });
        btn.disabled=false; btn.textContent='Tutup'; btn.onclick=function(){ closeSheet(); };
        return;
      }
      var r=list[i];
      prog.innerHTML='⏳ '+(i+1)+' dari '+list.length+': <b>'+esc(r.nama)+'</b>…<div class="bar"><i style="width:'+Math.round(i/list.length*100)+'%"></i></div>';
      if (bahanMiripDengan(r.nama).length){ hasil.lewat.push(r.nama); step(i+1); return; }
      api('adminSaveBahan', A.pin, {nama:r.nama, satuan:r.satuan, minimal:5, stokAwal:r.stok}).then(function(lst){
        A.data.bahan=lst; hasil.stok++;
        var b=lst.filter(function(x){ return normFull(x.nama)===normFull(r.nama); })[0]; if(!b) return;
        var sm=menuMiripDengan(r.nama)[0];
        if (sm){ if (menuPakaiBahan(sm.m,b.id)) return; return hubungkan(sm.m, b.id).then(function(){ hasil.link++; }); }
        if (r.harga) return api('adminSaveItem', A.pin, {id:'', nama:r.nama, kategori:kat, harga:r.harga, deskripsi:'', foto:'', tersedia:true, bestSeller:false, urutan:A.data.menu.length+1, stok:'', resep:[{b:b.id,q:1,alt:[]}]})
          .then(function(menu){ A.data.menu=menu; hasil.menu++; });
      }).then(function(){ step(i+1); }).catch(function(){ hasil.gagal.push(r.nama); step(i+1); });
    }
    step(0);
  };
}

/* ---------- Pesanan langsung di kasir (pelanggan pesan ke kasir) ---------- */
function posOpen(){
  var P = { cart:{}, cat:'Semua', q:'' };
  var menu = A.data.menu, bahan = A.data.bahan||[];
  var cats = ['Semua']; menu.forEach(function(m){ if(cats.indexOf(m.kategori)<0) cats.push(m.kategori); });
  var rules = []; try{ if(String(A.data.settings.diskon_aktif).toUpperCase()==='TRUE') rules=(JSON.parse(A.data.settings.diskon_aturan||'[]')||[]).filter(function(r){ return r.persen>0; }); }catch(e){}

    '<p class="muted" style="margin:0 0 8px;font-size:13px">Untuk pelanggan yang pesan langsung ke kasir. Ketuk menu untuk menambah.</p>' +
