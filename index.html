    '<div class="poscart" id="pk"></div>');
  function qtyOf(id){ return P.cart[id] ? P.cart[id].qty : 0; }
  function okItem(m){ return avail(m); }
  function drawGrid(){
    var q=P.q.toLowerCase();
    var list=menu.filter(function(m){ return (P.cat==='Semua' || m.kategori===P.cat) && (!q || m.nama.toLowerCase().indexOf(q)>=0); });
    $('#pg',sh).innerHTML = list.length ? list.map(function(m){
      var n=qtyOf(m.id), ok=okItem(m);
      return '<button class="posit'+(n?' sel':'')+(ok?'':' off')+'" data-add="'+m.id+'">'+(m.foto?'<img src="'+esc(m.foto)+'" alt="">':'')+
        (n?'<span class="qbadge">'+n+'</span>':'')+'<b>'+esc(m.nama)+'</b><small>'+(ok?rp(m.harga):'Habis')+'</small></button>';
    }).join('') : '<div class="empty">Menu tidak ditemukan.</div>';
  }
  function variantSel(m, c){
    var h='';
    (m.resep||[]).forEach(function(r){
      if (!r.alt || !r.alt.length) return;
      var opts=[r.b].concat(r.alt).map(function(id){ return bahan.filter(function(b){ return b.id===id; })[0]; }).filter(Boolean);
      if (opts.length<2) return;
      var cur=(c.pilih && c.pilih[r.b]) || r.b;
      h+='<label class="variant"><span>Pakai:</span><select data-pv="'+m.id+'" data-base="'+r.b+'">'+opts.map(function(b){ return '<option value="'+b.id+'"'+(b.id===cur?' selected':'')+(b.stok<r.q*c.qty?' disabled':'')+'>'+esc(b.nama)+(b.stok<r.q*c.qty?' (habis)':'')+'</option>'; }).join('')+'</select></label>';
    });
    return h;
  }
  function totals(){
    var sub=0, n=0; Object.keys(P.cart).forEach(function(id){ var m=menu.filter(function(x){ return x.id===id; })[0]; if(!m) return; sub+=m.harga*P.cart[id].qty; n+=P.cart[id].qty; });
    var dk=hitungDiskon(sub, rules); return {sub:sub, n:n, dk:dk, total:sub-dk.nominal};
  }
  function drawCart(){
    var ids=Object.keys(P.cart), t=totals();
    if (!ids.length){ $('#pk',sh).innerHTML='<div class="posempty">Belum ada pesanan. Ketuk menu di atas.</div>'; return; }
    $('#pk',sh).innerHTML = '<h4>🧾 Pesanan ('+t.n+' item)</h4>' + ids.map(function(id){
        var m=menu.filter(function(x){ return x.id===id; })[0], c=P.cart[id];
        return '<div class="line"><div class="info"><b>'+esc(m.nama)+'</b><span class="muted">'+rp(m.harga)+' × '+c.qty+' = '+rp(m.harga*c.qty)+'</span>'+variantSel(m,c) +
          '<input class="input" style="padding:6px 10px;font-size:13px" data-pn="'+id+'" maxlength="80" placeholder="+ catatan (pedas, tanpa es…)" value="'+esc(c.note||'')+'"></div>' +
          '<div class="step"><button data-pd="'+id+'" data-d="-1">−</button><span>'+c.qty+'</span><button data-pd="'+id+'" data-d="1">+</button></div></div>';
      }).join('') +
      (t.dk.nominal ? '<div class="discline">🏷️ '+esc(t.dk.ket)+' <b>−'+rp(t.dk.nominal)+'</b></div>' : '') +
      '<div class="sumrow"><span>Total</span><span class="price" style="font-size:22px">'+rp(t.total)+'</span></div>' +
      '<div style="display:flex;gap:8px"><label class="field" style="flex:1;margin:4px 0"><span>MEJA</span><input class="input" id="pmj" maxlength="10" placeholder="cth: 3" value="'+esc(P.meja||'')+'"></label>' +
        '<label class="field" style="flex:1.4;margin:4px 0"><span>NAMA (opsional)</span><input class="input" id="pnm" maxlength="40" value="'+esc(P.nama||'')+'"></label></div>' +
      '<label class="chk2"><input type="checkbox" id="pbk"'+(P.bungkus?' checked':'')+'> 🛍️ Bawa pulang / dibungkus</label>' +
      '<div class="field"><span>PEMBAYARAN</span><div class="paygrid" id="ppm">'+['Cash','QRIS','Transfer'].map(function(m){ return '<button type="button" data-m="'+m+'" class="'+(m===(P.metode||'Cash')?'on':'')+'"><i>'+PAY_ICON[m]+'</i>'+m+'</button>'; }).join('')+'</div></div>' +
      ((P.metode||'Cash')==='Cash' ? '<label class="field"><span>UANG DITERIMA (untuk kembalian)</span><input class="input" id="puang" inputmode="numeric" placeholder="cth: 50000" value="'+fmtNum(P.uang||'')+'"></label>' +
        '<div class="quick" id="pqk">'+[t.total,10000,20000,50000,100000].filter(function(v,i,a){ return v>=t.total && a.indexOf(v)===i; }).map(function(v){ return '<button type="button" data-v="'+v+'">'+rp(v)+'</button>'; }).join('')+'</div><div class="kembali" id="pkb"></div>' : '') +
      '<div class="posbtns"><button class="btn" id="plunas" style="background:var(--ok)">✓ Simpan & LUNAS</button><button class="btn ghost" id="pnanti">Simpan, bayar nanti</button></div>' +
      '<label class="chk2"><input type="checkbox" id="pstr"'+(P.struk!==false?' checked':'')+'> 🧾 Langsung tampilkan struk setelah lunas</label>';
    kemb();
  }
  function kemb(){ var el=$('#pkb',sh); if(!el) return; var u=parseInt(String(P.uang||'').replace(/\D/g,''),10)||0, k=u-totals().total;
    el.innerHTML = u ? (k>=0 ? 'Kembalian: <b>'+rp(k)+'</b>' : '<span style="color:var(--bad)">Uang kurang '+rp(-k)+'</span>') : ''; }
  function add(id, d){
    var m=menu.filter(function(x){ return x.id===id; })[0]; if(!m) return;
    if (d>0 && !okItem(m)){ toast(m.nama+' sedang habis',true); return; }
    var c=P.cart[id]||{qty:0,note:'',pilih:{}}; c.qty+=d;
    if (c.qty<=0) delete P.cart[id]; else P.cart[id]=c;
    drawGrid(); drawCart();
  }
  function keepForm(){ var g=function(s){ var e=$(s,sh); return e?e:null; };
    if(g('#pmj')) P.meja=g('#pmj').value; if(g('#pnm')) P.nama=g('#pnm').value; if(g('#pbk')) P.bungkus=g('#pbk').checked; if(g('#pstr')) P.struk=g('#pstr').checked; }
  drawGrid(); drawCart();
  $('#pq',sh).addEventListener('input', function(){ P.q=this.value; drawGrid(); });
  $('#pc',sh).onclick=function(e){ var b=e.target.closest('[data-c]'); if(!b) return; P.cat=b.dataset.c; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); drawGrid(); };
  $('#pg',sh).onclick=function(e){ var b=e.target.closest('[data-add]'); if(b){ keepForm(); add(b.dataset.add, 1); } };
  var pk=$('#pk',sh);
  pk.addEventListener('click', function(e){ var t;
    if ((t=e.target.closest('[data-pd]'))){ keepForm(); add(t.dataset.pd, Number(t.dataset.d)); return; }
    if ((t=e.target.closest('#ppm [data-m]'))){ keepForm(); P.metode=t.dataset.m; drawCart(); return; }
    if ((t=e.target.closest('#pqk [data-v]'))){ P.uang=t.dataset.v; $('#puang',sh).value=fmtNum(P.uang); kemb(); return; }
    if ((t=e.target.closest('#plunas'))){ keepForm(); simpan(true, t); return; }
    if ((t=e.target.closest('#pnanti'))){ keepForm(); simpan(false, t); return; }
  });
  pk.addEventListener('input', function(e){
    if (e.target.id==='puang'){ e.target.value=fmtNum(e.target.value); P.uang=e.target.value.replace(/\D/g,''); kemb(); return; }
    var id=e.target.dataset.pn; if(id && P.cart[id]) P.cart[id].note=e.target.value;
  });
  pk.addEventListener('change', function(e){ var id=e.target.dataset.pv; if(id && P.cart[id]){ P.cart[id].pilih[e.target.dataset.base]=e.target.value; } });
  function simpan(lunas, btn){
    var ids=Object.keys(P.cart); if(!ids.length){ toast('Pesanan masih kosong',true); return; }
    var meja=String(P.meja||'').trim() || (P.bungkus ? 'Bungkus' : '');
    if (!meja){ toast('Isi nomor meja, atau centang "Bawa pulang"',true); $('#pmj',sh).focus(); return; }
    var t=totals(), metode=P.metode||'Cash';
    if (lunas && metode==='Cash' && P.uang && (parseInt(P.uang,10)||0) < t.total){ toast('Uang diterima kurang dari total',true); return; }
    var all=sh.querySelectorAll('#plunas,#pnanti'); Array.prototype.forEach.call(all,function(b){ b.disabled=true; }); btn.textContent='Menyimpan…';
    var catatan=(P.bungkus?'🛍️ BUNGKUS / BAWA PULANG':'');
    // metode awal harus metode yang aktif untuk pelanggan; metode sebenarnya diset sesudahnya
    var st=A.data.settings, m0 = String(st.bayar_cash).toUpperCase()!=='FALSE' ? 'Cash' : String(st.bayar_qris).toUpperCase()==='TRUE' ? 'QRIS' : 'Transfer';
    var payload={meja:meja, nama:String(P.nama||'').trim(), metode:m0, catatan:catatan,
      items:ids.map(function(id){ return {id:id, qty:P.cart[id].qty, note:(P.cart[id].note||'').trim(), pilih:P.cart[id].pilih||{}}; })};
    api('submitOrder', payload).then(function(r){
      var patch={status:'Diproses', metode:metode};
      patch.statusBayar = lunas ? 'Lunas' : 'Belum';
      return api('adminUpdateOrder', A.pin, r.id, patch);
    }).then(function(o){
      A.data.orders = A.data.orders.filter(function(x){ return x.id!==o.id; }).concat([o]);
      A.seen[o.id]=1;
      closeSheet(); renderTabsBar(); if (A.tab==='pesanan') tabOrders();
      toast('Pesanan '+o.no+' tersimpan'+(lunas?' & LUNAS ✓':' (belum bayar)'));
      if (lunas && P.struk!==false) openStruk(o.id);
      api('adminGetData', A.pin).then(function(d){ A.data.menu=d.menu; A.data.bahan=d.bahan||[]; }).catch(function(){});
    }).catch(function(e){
      Array.prototype.forEach.call(all,function(b){ b.disabled=false; }); btn.textContent=lunas?'✓ Simpan & LUNAS':'Simpan, bayar nanti';
      toast(/ditutup/.test(e.message) ? 'Pemesanan sedang ditutup di Pengaturan. Aktifkan "Terima pesanan" dulu.' : e.message, true);
    });
  }
}

/* ---------- Pencocokan nama Stok ↔ Menu (tahan beda tulisan) ---------- */
/* "Good Day", "goodday", "GOOD-DAY" → sama. Huruf dobel diringkas: "Goodday" = "Goday". */
function normName(s){
  return String(s||'').toLowerCase()
    .replace(/\b(es|ice|panas|hot|dingin|cold|gelas|cup|sachet|saset|bungkus|pcs|renceng|dus)\b/g,' ')
    .replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1');
}
function normFull(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1'); }
function levDist(a,b){
  if (a===b) return 0; var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  var prev=[], cur=[]; for (var j=0;j<=n;j++) prev[j]=j;
  for (var i=1;i<=m;i++){ cur=[i]; for (var k=1;k<=n;k++){ cur[k]=Math.min(prev[k]+1, cur[k-1]+1, prev[k-1]+(a[i-1]===b[k-1]?0:1)); } prev=cur; }
  return prev[n];
}
/* Kemiripan 0..1 */
function mirip(a,b){
  var x=normName(a), y=normName(b), fx=normFull(a), fy=normFull(b);
  if (!fx || !fy) return 0;
  if (fx===fy) return 1;
  if (x && y && x===y) return 0.95;
  var s=0;
  if (x && y && Math.min(x.length,y.length)>=4 && (x.indexOf(y)>=0 || y.indexOf(x)>=0)) s=0.85;
  var L=Math.max(x.length,y.length)||1; s=Math.max(s, 1-levDist(x,y)/L);
  return s;
}
function menuPakaiBahan(m, bid){ return (m.resep||[]).some(function(r){ return r.b===bid || (r.alt||[]).indexOf(bid)>=0; }); }
function saranMenuUntukBahan(b, limit){
  return A.data.menu.filter(function(m){ return !menuPakaiBahan(m,b.id); })
    .map(function(m){ return {m:m, s:mirip(b.nama, m.nama)}; }).filter(function(x){ return x.s>=0.6; })
    .sort(function(a,c){ return c.s-a.s; }).slice(0, limit||4);
}
function saranBahanUntukMenu(m, limit){
  return (A.data.bahan||[]).filter(function(b){ return !menuPakaiBahan(m,b.id); })
    .map(function(b){ return {b:b, s:mirip(b.nama, m.nama)}; }).filter(function(x){ return x.s>=0.6; })
    .sort(function(a,c){ return c.s-a.s; }).slice(0, limit||3);
}
function menuMiripDengan(nama, kecualiId){
  return A.data.menu.filter(function(m){ return m.id!==kecualiId; }).map(function(m){ return {m:m, s:mirip(nama, m.nama)}; })
    .filter(function(x){ return x.s>=0.9; }).sort(function(a,c){ return c.s-a.s; });
}
function bahanMiripDengan(nama){
  return (A.data.bahan||[]).map(function(b){ return {b:b, s:mirip(nama, b.nama)}; }).filter(function(x){ return x.s>=0.9; }).sort(function(a,c){ return c.s-a.s; });
}
function hubungkan(m, bid){
  var it=JSON.parse(JSON.stringify(m)); it.resep=(it.resep||[]).concat([{b:bid, q:1, alt:[]}]);
  return api('adminSaveItem', A.pin, it).then(function(menu){ A.data.menu=menu; });
}

/* Alat: Hubungkan Menu ↔ Stok (satu halaman, simpan sekaligus) */
function miripMenu(bnama, m){ return Math.max(mirip(bnama, m.nama), mirip(bnama, m.kategori+' '+m.nama)*0.97); }
function cocokkanStokMenu(){
  var bahan=A.data.bahan||[];
  if (!bahan.length){ toast('Belum ada stok. Isi dulu di tab Stok.',true); return; }
  var cats=[]; A.data.menu.forEach(function(x){ if(cats.indexOf(x.kategori)<0) cats.push(x.kategori); });
  var pilih={}, saran={};
  A.data.menu.forEach(function(m){
    var r=m.resep||[];
    if (r.length){ pilih[m.id]=r[0].b; return; }
    var best=bahan.map(function(b){ return {b:b, s:miripMenu(b.nama, m)}; }).sort(function(a,c){ return c.s-a.s; })[0];
    if (best && best.s>=0.75){ pilih[m.id]=best.b.id; saran[m.id]=1; } else pilih[m.id]='';
  });
  var filter='belum';
  var sh=openSheet('<h3 class="serif">🔗 Hubungkan Menu ↔ Stok</h3>' +
    '<p class="muted" style="margin:0 0 6px;font-size:13px">Pilih stok yang dipakai setiap menu. Tebakan otomatis ditandai <span class="sarantag">saran</span> — periksa, ganti bila kurang tepat, lalu <b>Simpan semua</b>.</p>' +
    '<div class="seg" id="hf"><button data-v="belum" class="on">Belum terhubung</button><button data-v="semua">Semua menu</button><button data-v="stok">Stok tanpa menu</button></div>' +
    '<div id="hl"></div>' +
    '<div class="qprog hidden" id="hp"></div>' +
    '<button class="btn block" id="hs" style="position:sticky;bottom:0">Simpan semua</button>');
  function opts(sel){ return '<option value="">— tidak pakai stok —</option>'+bahan.map(function(b){ return '<option value="'+b.id+'"'+(b.id===sel?' selected':'')+'>'+esc(b.nama)+' ('+fmtQty(b.stok)+')</option>'; }).join(''); }
  function berubah(m){ var cur=(m.resep||[])[0]; return (cur?cur.b:'') !== (pilih[m.id]||''); }
  function draw(){
    var nUbah=A.data.menu.filter(berubah).length;
    $('#hs',sh).textContent = nUbah ? 'Simpan semua ('+nUbah+' perubahan)' : 'Tidak ada perubahan';
    $('#hs',sh).disabled = !nUbah;
    if (filter==='stok'){ drawStok(); return; }
    var list=A.data.menu.filter(function(m){ return filter==='semua' || !(m.resep||[]).length; });
    var cs=[]; list.forEach(function(m){ if(cs.indexOf(m.kategori)<0) cs.push(m.kategori); });
    $('#hl',sh).innerHTML = list.length ? cs.map(function(c){
      return '<h4 class="cmh">'+catIcon(c)+' '+esc(c)+'</h4>' + list.filter(function(m){ return m.kategori===c; }).map(function(m){
        var multi=(m.resep||[]).length>1;
        return '<div class="hrow'+(saran[m.id]&&pilih[m.id]?' sar':'')+(berubah(m)?' chg':'')+'"><div class="hn"><b>'+esc(m.nama)+'</b>'+(saran[m.id]&&pilih[m.id]?'<span class="sarantag">saran</span>':'')+(multi?'<small>+'+((m.resep.length)-1)+' bahan lain (atur di ✏️)</small>':'')+'</div>' +
          '<select class="input" data-hm="'+m.id+'">'+opts(pilih[m.id])+'</select></div>';
      }).join('');
    }).join('') : '<div class="cmok">✅ Semua menu sudah terhubung ke stok. Pilih "Semua menu" untuk mengubah.</div>';
  }
  function drawStok(){
    var dipakai={}; A.data.menu.forEach(function(m){ var b=pilih[m.id]; if(b) dipakai[b]=1; (m.resep||[]).forEach(function(r){ dipakai[r.b]=1; (r.alt||[]).forEach(function(a){ dipakai[a]=1; }); }); });
    var sisa=bahan.filter(function(b){ return !dipakai[b.id]; });
    $('#hl',sh).innerHTML = '<div class="hint" style="text-align:left;margin:4px 0 8px">Stok ini belum dipakai menu mana pun. Buat menunya di sini — cukup isi harga, foto bisa menyusul.</div>' +
      (sisa.length ? sisa.map(function(b){
        var mm=menuMiripDengan(b.nama);
        return '<div class="cmrow"><div class="cmt"><b>'+esc(b.nama)+'</b><small>stok '+fmtQty(b.stok)+' '+esc(b.satuan)+'</small></div>' +
          (mm.length?'<div class="cmwarn">⚠️ Mirip menu "'+esc(mm[0].m.nama)+'" — pilih stok ini di menu tersebut (tab "Semua menu").</div>':'') +
          '<div style="display:flex;gap:6px;margin-top:6px"><select class="input" data-mk-kat="'+b.id+'" style="flex:1.2">'+cats.map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('')+'</select>' +
          '<input class="input" data-mk-h="'+b.id+'" inputmode="numeric" placeholder="Harga jual" style="flex:1"><button type="button" class="btn sm" data-mk="'+b.id+'" style="background:var(--ok)">＋ Menu</button></div></div>';
      }).join('') : '<div class="cmok">✅ Semua stok sudah dipakai menu.</div>');
    Array.prototype.forEach.call(sh.querySelectorAll('[data-mk-kat]'), function(sel){
      var b=bahanById(sel.dataset.mkKat), g=A.data.menu.map(function(m){ return {k:m.kategori, s:mirip(b.nama, m.nama)}; }).sort(function(a,c){ return c.s-a.s; })[0];
      if (g && g.s>0.4) sel.value=g.k; });
  }
  draw();
  $('#hf',sh).onclick=function(e){ var b=e.target.closest('[data-v]'); if(!b) return; filter=b.dataset.v; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); draw(); };
  $('#hl',sh).addEventListener('change', function(e){ var id=e.target.dataset.hm; if(!id) return; pilih[id]=e.target.value; delete saran[id]; var row=e.target.closest('.hrow'); row.classList.remove('sar'); var tg=row.querySelector('.sarantag'); if(tg) tg.remove();
    var m=A.data.menu.filter(function(x){ return x.id===id; })[0]; row.classList.toggle('chg', berubah(m));
    var nUbah=A.data.menu.filter(berubah).length; $('#hs',sh).textContent = nUbah ? 'Simpan semua ('+nUbah+' perubahan)' : 'Tidak ada perubahan'; $('#hs',sh).disabled=!nUbah; });
  $('#hl',sh).addEventListener('input', function(e){ if (e.target.dataset.mkH!==undefined) e.target.value=fmtNum(e.target.value); });
  $('#hl',sh).addEventListener('click', function(e){
    var t=e.target.closest('[data-mk]'); if(!t) return;
    var b=bahanById(t.dataset.mk), harga=parseInt(sh.querySelector('[data-mk-h="'+b.id+'"]').value.replace(/\D/g,''),10)||0, kat=sh.querySelector('[data-mk-kat="'+b.id+'"]').value;
    if (!harga){ toast('Isi harga jual '+b.nama,true); return; }
    if (A.data.menu.some(function(m){ return normFull(m.nama)===normFull(b.nama); })){ toast('Menu "'+b.nama+'" sudah ada',true); return; }
    t.disabled=true; t.textContent='…';
    api('adminSaveItem', A.pin, {id:'', nama:b.nama, kategori:kat, harga:harga, deskripsi:'', foto:'', tersedia:true, bestSeller:false, urutan:A.data.menu.length+1, stok:'', resep:[{b:b.id,q:1,alt:[]}]})
      .then(function(menu){ A.data.menu=menu; var nm=menu.filter(function(m){ return normFull(m.nama)===normFull(b.nama); })[0]; if(nm) pilih[nm.id]=b.id; toast('Menu '+b.nama+' dibuat ✓ (foto bisa lewat 📷)'); draw(); })
      .catch(function(err){ t.disabled=false; t.textContent='＋ Menu'; toast(err.message,true); });
  });
  $('#hs',sh).onclick=function(){
    var ubah=A.data.menu.filter(berubah); if(!ubah.length) return;
    var btn=this; btn.disabled=true; var prog=$('#hp',sh); prog.classList.remove('hidden'); var ok=0, gagal=[];
    function step(i){
      if (i>=ubah.length){
        prog.innerHTML='✅ <b>'+ok+' menu</b> sudah terhubung ke stok'+(gagal.length?'<br>⚠️ Gagal: '+gagal.map(esc).join(', ')+' — tekan simpan lagi':'');
        draw(); if (!gagal.length) toast(ok+' menu terhubung ke stok ✓');
        return;
      }
      var m=ubah[i], it=JSON.parse(JSON.stringify(m)), b=pilih[m.id], r=it.resep||[];
      if (!b) r=r.slice(1); else if (r.length) r[0]={b:b, q:r[0].b===b?r[0].q:1, alt:r[0].b===b?r[0].alt:[]}; else r=[{b:b,q:1,alt:[]}];
      it.resep=r;
      prog.innerHTML='⏳ '+(i+1)+' dari '+ubah.length+': <b>'+esc(m.nama)+'</b>…<div class="bar"><i style="width:'+Math.round(i/ubah.length*100)+'%"></i></div>';
      api('adminSaveItem', A.pin, it).then(function(menu){ A.data.menu=menu; ok++; step(i+1); }).catch(function(){ gagal.push(m.nama); step(i+1); });
    }
    step(0);
  };
  var obs=new MutationObserver(function(){ if(!document.body.contains(sh)){ obs.disconnect(); if(A.tab==='stok') tabStok(); if(A.tab==='menu') tabMenu(); } });
  obs.observe(document.body,{childList:true});
}

/* ---------- Tab Keuangan / Kas (khusus Owner) ---------- */
var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var KATEGORI_KELUAR = ['Galon','Gas LPG','Bahan Baku','Es Batu','Listrik','Gaji','Sewa','Lainnya'];
var KATEGORI_MASUK = ['Modal','Penjualan Manual','Lainnya'];
var K = { mode:'hari', tgl:'', bln:'', thn:'', data:null, list:'semua' };
function kasRange(){
  if (!K.tgl){ K.tgl=todayISO(); K.bln=K.tgl.slice(0,7); K.thn=K.tgl.slice(0,4); }
  if (K.mode==='hari') return [K.tgl, K.tgl];
  if (K.mode==='bulan'){ var y=+K.bln.slice(0,4), m=+K.bln.slice(5,7); var last=new Date(y,m,0).getDate(); return [K.bln+'-01', K.bln+'-'+('0'+last).slice(-2)]; }
  return [K.thn+'-01-01', K.thn+'-12-31'];
}
function fmtTgl(iso){ var p=iso.split('-'); return +p[2]+' '+BULAN[+p[1]-1]+' '+p[0]; }
function kasLabel(){ var r=kasRange(); return K.mode==='hari' ? fmtTgl(r[0]) + (r[0]===todayISO()?' (hari ini)':'') : K.mode==='bulan' ? BULAN_PANJANG[+K.bln.slice(5,7)-1]+' '+K.bln.slice(0,4) : 'Tahun '+K.thn; }
function tabKas(){
  kasRange();
  var years=[]; for (var y=new Date().getFullYear(); y>=2024; y--) years.push(y);
  $('#tab').innerHTML =
    '<div class="seg" id="km">'+[['hari','Harian'],['bulan','Bulanan'],['tahun','Tahunan']].map(function(x){ return '<button data-k="'+x[0]+'" class="'+(K.mode===x[0]?'on':'')+'">'+x[1]+'</button>'; }).join('')+'</div>' +
    '<div class="kasdate">' +
      (K.mode==='hari' ? '<input class="input" type="date" id="kd" value="'+K.tgl+'">' :
       K.mode==='bulan' ? '<input class="input" type="month" id="kd" value="'+K.bln+'">' :
       '<select class="input" id="kd">'+years.map(function(y){ return '<option'+(String(y)===K.thn?' selected':'')+'>'+y+'</option>'; }).join('')+'</select>') +
      '<button class="btn ghost" id="kr" title="Muat ulang">↻</button></div>' +
    '<div class="kasbtns"><button class="btn" id="kout" style="background:var(--bad)">− Pengeluaran</button><button class="btn" id="kbel" style="background:var(--brand)">🛒 Belanja</button><button class="btn" id="kin" style="background:var(--ok)">＋ Pemasukan</button></div>' +
    '<button class="btn dark block" id="klap" style="margin-bottom:14px">📄 Laporan untuk Bos (screenshot / WhatsApp)</button>' +
    '<div id="kbody"><div class="loading">Menghitung…</div></div>';
  $('#km').onclick=function(e){ var b=e.target.closest('[data-k]'); if(!b) return; K.mode=b.dataset.k; tabKas(); };
  $('#kd').onchange=function(){ var v=this.value; if(!v) return; if(K.mode==='hari') K.tgl=v; else if(K.mode==='bulan') K.bln=v; else K.thn=v; kasLoad(); };
  $('#kr').onclick=kasLoad;
  $('#kout').onclick=function(){ editEntry({jenis:'Pengeluaran'}); };
  $('#kin').onclick=function(){ editEntry({jenis:'Pemasukan'}); };
  $('#kbel').onclick=function(){ editBelanja(null); };
  $('#klap').onclick=function(){ if(!K.data){ toast('Tunggu data selesai dimuat',true); return; } openLaporan(); };
  kasLoad();
}
function kasLoad(){
  var r=kasRange(); var body=$('#kbody'); if(body) body.innerHTML='<div class="loading">Menghitung…</div>';
  api('adminReport', A.pin, r[0], r[1]).then(function(d){ K.data=d; if (A.tab==='kas') kasRender(); })
    .catch(function(e){ if($('#kbody')) $('#kbody').innerHTML='<div class="empty">Gagal memuat: '+esc(e.message)+'<br><button class="btn" onclick="kasLoad()">Coba lagi</button></div>'; });
}
function kasCalc(orders, entries){
  var c={jual:0, masukLain:0, keluar:0, met:{Cash:0,QRIS:0,Transfer:0}, metKeluar:{Cash:0,QRIS:0,Transfer:0}, trx:0, belum:0, belumRp:0, batal:0, item:{}};
  orders.forEach(function(o){
    if (o.status==='Batal'){ c.batal++; return; }
    if (o.statusBayar==='Lunas'){ c.jual+=o.nominal; c.trx++; c.met[o.metode]=(c.met[o.metode]||0)+o.nominal;
      o.items.forEach(function(i){ c.item[i.nama]=(c.item[i.nama]||0)+Number(i.qty||0); }); }
    else { c.belum++; c.belumRp+=o.total; }
  });
  entries.forEach(function(e){
    if (e.jenis==='Pemasukan'){ c.masukLain+=e.nominal; c.met[e.metode]=(c.met[e.metode]||0)+e.nominal; }
    else { c.keluar+=e.nominal; c.metKeluar[e.metode]=(c.metKeluar[e.metode]||0)+e.nominal; }
  });
  c.masuk=c.jual+c.masukLain; c.bersih=c.masuk-c.keluar;
  return c;
}
function kasRender(){
  var d=K.data, c=kasCalc(d.orders, d.entries);
  var html =
    '<div class="kashead">'+esc(kasLabel())+'</div>' +
    saldoCardHtml(d, c) +
    '<div class="kasbig"><small>KAS BERSIH '+(K.mode==='hari'?'HARI INI':'PERIODE INI')+'</small><b class="'+(c.bersih<0?'neg':'')+'">'+rp(c.bersih)+'</b><span>Pemasukan − Pengeluaran</span></div>' +
    '<div class="kas2"><div class="kin"><small>PEMASUKAN</small><b>'+rp(c.masuk)+'</b><span>Penjualan '+rp(c.jual)+(c.masukLain?' + lain '+rp(c.masukLain):'')+'</span></div>' +
      '<div class="kout"><small>PENGELUARAN</small><b>'+rp(c.keluar)+'</b><span>'+d.entries.filter(function(e){return e.jenis==='Pengeluaran';}).length+' catatan</span></div></div>' +
    '<div class="kasmet">'+['Cash','QRIS','Transfer'].map(function(m){
        var net=(c.met[m]||0)-(c.metKeluar[m]||0);
        return '<div><small>'+PAY_ICON[m]+' '+m+'</small><b>'+rp(c.met[m]||0)+'</b>'+((c.metKeluar[m]||0)?'<span>keluar '+rp(c.metKeluar[m])+' · sisa '+rp(net)+'</span>':'<span>&nbsp;</span>')+'</div>';
      }).join('')+'</div>' +
    '<div class="kasinfo"><span>🧾 <b>'+c.trx+'</b> transaksi lunas</span>' +
      (c.belum?'<span style="color:var(--warn)">⏳ <b>'+c.belum+'</b> belum bayar ('+rp(c.belumRp)+')</span>':'') +
      (c.batal?'<span class="muted">✕ '+c.batal+' batal</span>':'') + '</div>';

  // Rekap per hari (bulanan) / per bulan (tahunan)
  if (K.mode!=='hari'){
    var groups={}, keyOf = K.mode==='bulan' ? function(t){ return t; } : function(t){ return t.slice(0,7); };
    d.orders.forEach(function(o){ var k=keyOf(o.tgl); (groups[k]=groups[k]||{o:[],e:[]}).o.push(o); });
    d.entries.forEach(function(e){ var k=keyOf(e.tanggal); (groups[k]=groups[k]||{o:[],e:[]}).e.push(e); });
    var keys=Object.keys(groups).sort().reverse();
    html += '<h3 class="serif kash3">📅 Rekap '+(K.mode==='bulan'?'per Hari':'per Bulan')+'</h3>' +
      (keys.length ? (function(){
        var si=saldoInfo(d,c), run = si && !si.belum ? si.sebelum : null, saldoAt={};
        keys.slice().sort().forEach(function(k){ var g=kasCalc(groups[k].o, groups[k].e); if(run!==null){ run+=g.bersih; saldoAt[k]=run; } });
        return '<div class="rekap'+(si && !si.belum?' w5':'')+'"><div class="rh"><span>'+(K.mode==='bulan'?'Tanggal':'Bulan')+'</span><span>Masuk</span><span>Keluar</span><span>Bersih</span>'+(si && !si.belum?'<span>Saldo</span>':'')+'</div>' +
        keys.map(function(k){ var g=kasCalc(groups[k].o, groups[k].e);
          var label = K.mode==='bulan' ? fmtTgl(k).replace(/ \d{4}$/,'') : BULAN_PANJANG[+k.slice(5,7)-1];
          return '<button class="rr" data-drill="'+k+'"><span>'+label+'</span><span>'+rp(g.masuk).replace('Rp','')+'</span><span>'+rp(g.keluar).replace('Rp','')+'</span><b class="'+(g.bersih<0?'neg':'')+'">'+rp(g.bersih).replace('Rp','')+'</b>'+(saldoAt[k]!==undefined?'<span class="sal">'+rp(saldoAt[k]).replace('Rp','')+'</span>':'')+'</button>'; }).join('') + '</div>'; })()
        : '<div class="empty">Belum ada data.</div>');
  }

  // Barang keluar (SEMUA menu yang terjual, tidak dibatasi)
  var bk={}, bkQ=0, bkRp=0, bkBelum=0;
  d.orders.forEach(function(o){
    if (o.status==='Batal') return;
    var lun=isLunas(o);
    (o.items||[]).forEach(function(i){
      var q=Number(i.qty||0), r=q*Number(i.harga||0);
      if(!bk[i.nama]) bk[i.nama]={q:0,r:0,b:0};
      bk[i.nama].q+=q; bk[i.nama].r+=r; bkQ+=q; bkRp+=r;
      if(!lun){ bk[i.nama].b+=q; bkBelum+=q; }
    });
  });
  var bkList=Object.keys(bk).map(function(n){ return [n,bk[n]]; }).sort(function(a,b){ return b[1].q-a[1].q || a[0].localeCompare(b[0]); });
  if (bkList.length) html += '<h3 class="serif kash3">📋 Barang Keluar '+(K.mode==='hari'?'Hari Ini':'Periode Ini')+'</h3><div class="toplist bklist">' +
    bkList.map(function(t){ return '<div><span>'+esc(t[0])+(t[1].b?' <small class="bkb">('+t[1].b+' belum bayar)</small>':'')+'</span><b>'+t[1].q+'×</b><em>'+rp(t[1].r)+'</em></div>'; }).join('') +
    '<div class="bktot"><span>TOTAL '+bkList.length+' macam menu</span><b>'+bkQ+'×</b><em>'+rp(bkRp)+'</em></div></div>' +

function fmtNum(v){ v=String(v||'').replace(/\D/g,''); return v ? Number(v).toLocaleString('id-ID') : ''; }
function editEntry(e){
  var isNew=!e.id, jenis=e.jenis||'Pengeluaran', metode=e.metode||'Cash';
  var cats = jenis==='Pengeluaran' ? KATEGORI_KELUAR : KATEGORI_MASUK;

    (isNew?'':'<div class="field"><span>JENIS</span><div class="seg" id="ej" style="margin:0"><button type="button" data-v="Pengeluaran" class="'+(jenis==='Pengeluaran'?'on':'')+'">Pengeluaran</button><button type="button" data-v="Pemasukan" class="'+(jenis==='Pemasukan'?'on':'')+'">Pemasukan</button></div></div>') +
    '<label class="field"><span>NOMINAL (Rp) *</span><input class="input bignum" id="en" inputmode="numeric" placeholder="0" value="'+fmtNum(e.nominal)+'"></label>' +
    '<div class="field"><span>UNTUK APA? *</span><div class="catchips" id="ec">'+cats.map(function(c){ return '<button type="button" data-v="'+esc(c)+'" class="'+(c===e.kategori?'on':'')+'">'+esc(c)+'</button>'; }).join('')+'</div>' +
      '<input class="input" id="ek" maxlength="40" placeholder="atau ketik sendiri, cth: Plastik" value="'+esc(cats.indexOf(e.kategori)<0?(e.kategori||''):'')+'" style="margin-top:8px"></div>' +
    '<label class="field"><span>TANGGAL</span><input class="input" type="date" id="et" value="'+(e.tanggal||todayISO())+'"></label>' +
    '<div class="field"><span>'+(jenis==='Pengeluaran'?'DIBAYAR PAKAI':'MASUK LEWAT')+'</span><div class="seg" id="em" style="margin:0">'+['Cash','QRIS','Transfer'].map(function(m){ return '<button type="button" data-v="'+m+'" class="'+(m===metode?'on':'')+'">'+PAY_ICON[m]+' '+m+'</button>'; }).join('')+'</div></div>' +
    '<label class="field"><span>CATATAN (opsional)</span><input class="input" id="eo" maxlength="200" placeholder="cth: 2 galon + 1 tabung gas 3kg" value="'+esc(e.catatan||'')+'"></label>' +
    '<button class="btn block" id="es">Simpan</button>' +
    (isNew?'':'<button class="btn danger block" style="margin-top:10px" id="ed">🗑️ Hapus Catatan</button>'));
  var kategori = e.kategori || '';
  $('#en',sh).addEventListener('input', function(){ var p=this.value.length-this.selectionStart; this.value=fmtNum(this.value); try{ var q=Math.max(0,this.value.length-p); this.setSelectionRange(q,q);}catch(x){} });
  $('#ec',sh).onclick=function(ev){ var b=ev.target.closest('[data-v]'); if(!b) return; kategori=b.dataset.v; $('#ek',sh).value=''; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); };
  $('#ek',sh).addEventListener('input', function(){ if(this.value){ kategori=''; Array.prototype.forEach.call($('#ec',sh).children,function(x){ x.classList.remove('on'); }); } });
  function seg(sel, cb){ if(!$(sel,sh)) return; $(sel,sh).onclick=function(ev){ var b=ev.target.closest('[data-v]'); if(!b) return; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); cb(b.dataset.v); }; }
  seg('#em', function(v){ metode=v; }); seg('#ej', function(v){ jenis=v; });

  $('#es',sh).onclick=function(){
    var nominal=parseInt($('#en',sh).value.replace(/\D/g,''),10)||0, kat=($('#ek',sh).value.trim()||kategori);

    if(!kat){ toast('Pilih atau ketik untuk apa',true); return; }
    var b=this; b.disabled=true; b.textContent='Menyimpan…';
    api('adminSaveEntry', A.pin, {id:e.id||'', jenis:jenis, nominal:nominal, kategori:kat, tanggal:$('#et',sh).value, metode:metode, catatan:$('#eo',sh).value.trim()})
      .then(function(){ closeSheet(); toast(jenis+' '+rp(nominal)+' tersimpan ✓'); kasLoad(); })
      .catch(function(err){ b.disabled=false; b.textContent='Simpan'; toast(err.message,true); });
  };
  if ($('#ed',sh)) $('#ed',sh).onclick=function(){
    confirmBox('Hapus catatan '+e.kategori+' '+rp(e.nominal)+'?','Hapus').then(function(ok){ if(!ok) return;
      api('adminDeleteEntry', A.pin, e.id).then(function(){ closeSheet(); toast('Catatan dihapus'); kasLoad(); }).catch(function(err){ toast(err.message,true); }); });
  };
}

  var done=function(){ document.body.classList.remove('print-struk'); ps.textContent=''; area.innerHTML=''; };

    var imgs=area.querySelectorAll('img'), wait=0;

    }).join('') +
    '<button class="btn block" id="uadd" style="margin-top:6px">＋ Tambah Akun Admin</button>' +

    '<h3 class="serif" style="margin:28px 0 4px">🏪 Data Warkop</h3>' +
    '<div class="field"><span>LOGO</span><div class="photo-pick"><img id="lprev" src="'+esc(logoSrc(s))+'" alt="" style="object-fit:contain;background:none">' +
      '<div><label class="btn ghost sm" style="cursor:pointer">Ganti logo<input type="file" accept="image/*" id="lfile" hidden></label>' +
      (s.logo_url?' <button class="btn ghost sm" id="lreset">Pakai logo bawaan</button>':'')+'<div class="hint" id="lstat" style="text-align:left">Tampil di menu pelanggan & ikon browser</div></div></div></div>' +
    '<label class="field"><span>NAMA WARKOP</span><input class="input" id="sn" maxlength="60" value="'+esc(s.nama_warkop)+'"></label>' +
    '<label class="field"><span>TAGLINE / KETERANGAN</span><input class="input" id="st" maxlength="100" value="'+esc(s.tagline)+'"></label>' +
    '<label class="field"><span>CATATAN PEMBAYARAN (tampil ke pelanggan)</span><input class="input" id="sb" maxlength="150" value="'+esc(s.catatan_bayar)+'"></label>' +
    '<div class="checkrow"><span><b>Terima pesanan lewat HP</b><br><small class="muted">Matikan saat mau tutup; menu tetap bisa dilihat</small></span><label class="switch"><input type="checkbox" id="sa"'+(aktif?' checked':'')+'><span></span></label></div>' +
    '<label class="field"><span>JUMLAH MEJA</span><input class="input" id="sm" inputmode="numeric" value="'+esc(s.jumlah_meja)+'"></label>' +
    '<button class="btn block" id="ssave">Simpan Data Warkop</button>' +
    '<h3 class="serif" style="margin:28px 0 4px">🔳 QR Meja</h3><button class="btn ghost block" id="gotoqr">Buka & Cetak QR Meja</button>' +
    bayarSettingsHtml() + diskonSettingsHtml() + strukSettingsHtml() + mine;

  $('#uadd').onclick=function(){ editUser(null); };
  $('#tab').onclick=function(e){ var b=e.target.closest('[data-user]'); if(b) editUser(b.dataset.user); };
  function setLogo(url, msg){ return api('adminSaveSettings', A.pin, {logo_url:url}).then(function(ns){ A.data.settings=ns; setFavicon(logoSrc(ns)); $('.adm-logo').src=logoSrc(ns); toast(msg); tabSettings(); }); }
  $('#lfile').onchange=function(e){
    var f=e.target.files[0]; if(!f) return; $('#lstat').textContent='Mengunggah logo…';
    resizeImage(f, 512, 'image/png').then(function(d){ return api('adminUploadPhoto', A.pin, d, 'logo.png'); })
      .then(function(url){ return setLogo(url, 'Logo diganti ✓'); })
      .catch(function(err){ $('#lstat').textContent='Gagal: '+err.message; });
  };
  if ($('#lreset')) $('#lreset').onclick=function(){ setLogo('', 'Kembali ke logo bawaan'); };
  $('#ssave').onclick=function(){
    var b=this; b.disabled=true;
    api('adminSaveSettings', A.pin, {nama_warkop:$('#sn').value.trim(), tagline:$('#st').value.trim(), catatan_bayar:$('#sb').value.trim(), pesan_aktif:$('#sa').checked?'TRUE':'FALSE', jumlah_meja:$('#sm').value.replace(/\D/g,'')||'10'})
      .then(function(ns){ A.data.settings=ns; b.disabled=false; $('.adm-top h1').textContent=ns.nama_warkop; toast('Data warkop disimpan ✓'); })
      .catch(function(e){ b.disabled=false; toast(e.message,true); });
  };
  bindBayarSettings();
  bindDiskonSettings();
  $('#gotoqr').onclick=function(){ A.tab='qr'; renderTab(); window.scrollTo(0,0); };
  bindStrukSettings();
  bindMyPassword();
}

function bindMyPassword(){
  $('#pch').onclick=function(){
    var o=$('#po').value, n=$('#pn').value;
    if(!o||!n){ toast('Isi password lama dan baru',true); return; }
    if(n.length<4){ toast('Password baru minimal 4 karakter',true); return; }
    var b=this; b.disabled=true;
    api('adminChangePassword', A.pin, o, n).then(function(r){ A.pin=r.token; lstore('adminToken', r.token); $('#po').value=''; $('#pn').value=''; b.disabled=false; toast('Password diganti ✓'); })
      .catch(function(e){ b.disabled=false; toast(e.message,true); });
  };
}

function editUser(username){
  var u = username ? (A.data.users||[]).filter(function(x){ return x.username===username; })[0] : {username:'',nama:'',peran:'Kasir'};
  var isNew = !username;
  var sh=openSheet('<h3 class="serif">'+(isNew?'Tambah Akun Admin':'Ubah Akun')+'</h3>' +
    '<label class="field"><span>NAMA (tampil di aplikasi)</span><input class="input" id="un" maxlength="40" value="'+esc(u.nama)+'" placeholder="cth: Budi"></label>' +
    '<label class="field"><span>ID LOGIN (huruf kecil/angka, tanpa spasi)</span><input class="input" id="uu" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" value="'+esc(u.username)+'" placeholder="cth: budi"'+(isNew?'':' readonly style="opacity:.6"')+'></label>' +
    '<label class="field"><span>'+(isNew?'PASSWORD (min. 4 karakter)':'PASSWORD BARU (kosongkan jika tidak diganti)')+'</span><input class="input" id="upw" type="text" autocomplete="off" placeholder="'+(isNew?'cth: budi123':'biarkan kosong')+'"></label>' +
    '<div class="field"><span>PERAN</span><div class="seg" id="urole" style="margin:0">' +
      '<button type="button" data-r="Owner" class="'+(u.peran==='Owner'?'on':'')+'">👑 Owner</button><button type="button" data-r="Kasir" class="'+(u.peran!=='Owner'?'on':'')+'">🧑‍🍳 Kasir</button></div>' +
      '<div class="hint" style="text-align:left">Owner: semua fitur. Kasir: hanya pesanan & stok.</div></div>' +
    '<button class="btn block" id="usave">Simpan Akun</button>' +
    (!isNew && u.username!==A.me.username ? '<button class="btn danger block" style="margin-top:10px" id="udel">Hapus Akun</button>' : ''));
  var role = u.peran==='Owner' ? 'Owner' : 'Kasir';
  $('#urole',sh).onclick=function(e){ var b=e.target.closest('[data-r]'); if(!b) return; role=b.dataset.r; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on', x===b); }); };
  $('#un',sh).addEventListener('input', function(){ if(isNew && !$('#uu',sh).dataset.touched) $('#uu',sh).value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,'').slice(0,20); });
  $('#uu',sh).addEventListener('input', function(){ this.dataset.touched=1; this.value=this.value.toLowerCase().replace(/[^a-z0-9._]/g,''); });
  $('#usave',sh).onclick=function(){
    var d={isNew:isNew, nama:$('#un',sh).value.trim(), username:$('#uu',sh).value.trim(), password:$('#upw',sh).value, peran:role};
    if(!d.nama){ toast('Isi nama',true); return; }
    if(d.username.length<3){ toast('ID login minimal 3 huruf',true); return; }
    if(isNew && d.password.length<4){ toast('Password minimal 4 karakter',true); return; }
    var b=this; b.disabled=true; b.textContent='Menyimpan…';
    api('adminSaveUser', A.pin, d).then(function(users){
      A.data.users=users; closeSheet();
      if (d.username===A.me.username){ loadAdmin(true); }
      else tabSettings();
      toast(isNew ? 'Akun '+d.nama+' dibuat ✓ — ID: '+d.username : 'Akun disimpan ✓');
    }).catch(function(e){ b.disabled=false; b.textContent='Simpan Akun'; toast(e.message,true); });
  };
  if ($('#udel',sh)) $('#udel',sh).onclick=function(){
    confirmBox('Hapus akun '+u.nama+' ('+u.username+')? Orang ini tidak bisa login lagi.','Hapus').then(function(ok){ if(!ok) return;
      api('adminDeleteUser', A.pin, u.username).then(function(users){ A.data.users=users; closeSheet(); tabSettings(); toast('Akun dihapus'); }).catch(function(e){ toast(e.message,true); }); });
  };
}

/* =====================================================================
   6. MULAI
   ===================================================================== */
function start(){ $('#app').innerHTML='<div class="loading">Memuat…</div>'; if (MODE==='admin') startAdmin(); else startCustomer(); }
document.addEventListener('click', unlockAudio, {once:true});
if (USE_API) {
  try {
    var mf=document.createElement('link'); mf.rel='manifest'; mf.href='manifest.json'; document.head.appendChild(mf);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  } catch(e){}
}
readRoute(); start();
</script>
</body>
