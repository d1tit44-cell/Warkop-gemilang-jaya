<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8532a">
<title>Kasir Warkop Gemilang Jaya</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html,body{margin:0;height:100%;background:#f6efe4;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-family:system-ui,sans-serif;color:#2b1d14;background:#f6efe4;transition:opacity .4s}
  #splash img{width:140px;height:140px;border-radius:28px}
  #splash p{margin:0;font-weight:700}
  #splash small{color:#86705c}
  #splash a{color:#b8532a;font-weight:700}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" title="Kasir Warkop" allow="clipboard-write; autoplay"></iframe>
<div id="splash">
  <img src="icon.png" alt="">
  <p>Kasir Warkop Gemilang Jaya</p>
  <small id="msg">Memuat…</small>
</div>
<script>
  // Alamat aplikasi Google Apps Script (halaman owner/kasir)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzAEauS3kNKiQ5R9swMiGRZdq5eEUlpeCZ2sHA7iMg9XUSQD6yp3lGqm0bfQkE2AboBeQ/exec?admin';

  var frame = document.getElementById('app'), splash = document.getElementById('splash'), msg = document.getElementById('msg');
  function load(){
    if (!navigator.onLine){ msg.innerHTML = 'Tidak ada internet.<br><a href="#" onclick="load();return false">Coba lagi</a>'; return; }
    msg.textContent = 'Memuat…';
    frame.src = APP_URL;
  }
  frame.addEventListener('load', function(){ if (frame.src) splash.classList.add('hide'); });
  setTimeout(function(){ if (!splash.classList.contains('hide')) msg.innerHTML = 'Masih memuat… sinyal lambat?<br><a href="'+APP_URL+'">Buka lewat browser</a>'; }, 15000);
  window.addEventListener('online', function(){ if (!frame.src) load(); });
  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
